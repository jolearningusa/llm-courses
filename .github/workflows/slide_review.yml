# Every other Monday, ask whether any slides should change. It runs
# scripts/check_slide_review.py and, when that proposes something, keeps one
# open issue labeled "slide-review". The issue asks for a yes or no. Slides
# are not edited by this workflow. A hand run (Actions → Slide review → Run
# workflow) checks immediately; the schedule skips odd ISO weeks so the
# Monday cron lands about every two weeks. How to answer: docs/updating-courses.md.
name: Slide review

on:
  schedule:
    - cron: "23 7 * * 1"  # Mondays 07:23 UTC; odd ISO weeks exit before the check
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: slide-review
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run every other Monday, or whenever started by hand
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd ISO week $week"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Review slides against their sources
        id: check
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python scripts/check_slide_review.py --report slide_review.md; then
            echo "attention=false" >> "$GITHUB_OUTPUT"
          else
            echo "attention=true" >> "$GITHUB_OUTPUT"
          fi
          cat slide_review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the slide-review issue
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENTION: ${{ steps.check.outputs.attention }}
        run: |
          gh label create slide-review --color 1D76DB --description "Slides may need a change; waiting for a yes or no" --force
          number=$(gh issue list --state open --label slide-review --limit 1 --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\n_Updated by the [Slide review workflow](%s)._\n' "$run_url" >> slide_review.md
          if [ "$ATTENTION" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "Slide review: do you want these slides changed?" --body-file slide_review.md
            else
              gh issue create --title "Slide review: do you want these slides changed?" --label slide-review --body-file slide_review.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No slide updates to propose as of $(date -u +%F) ([run]($run_url))."
          fi
