# Checks every pull request and every push to main runs, so main stays
# publishable. "links" builds the site and fails on a relative link that does
# not resolve; "slides" opens every deck in headless Chromium and fails on
# console errors or broken slide numbering. Both can be made required status
# checks in the main ruleset (see docs/git-workflow.md).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install markdown==3.7 pygments==2.18.0
      - name: Build site
        run: python scripts/build_site.py --out _site
      - name: Check relative links
        run: python scripts/check_site.py --site _site

  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check slide decks
        run: node scripts/check_slides.mjs
