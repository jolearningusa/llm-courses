<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-cancel-title accelerator-04-cancel-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-cancel-title">Cancellation depends on command state</title><desc id="accelerator-04-cancel-desc">In-flight cancellation is deliberately unsupported in this model. QUEUED cancel → observe → reap IN FLIGHT cancel rejected; complete or reset DONE observe → reap</desc><defs><marker id="accelerator-04-cancel-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="255" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="152.5" y="70.5" font-size="23" fill="#8de0cf" text-anchor="middle">QUEUED</text><path d="M280,62 L420,62" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="70" font-size="24" fill="#8de0cf" text-anchor="start">cancel → observe → reap</text><rect x="25" y="135" width="255" height="65" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="152.5" y="175.5" font-size="23" fill="#ff9e9e" text-anchor="middle">IN FLIGHT</text><path d="M280,167 L420,167" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="175" font-size="24" fill="#ff9e9e" text-anchor="start">cancel rejected; complete or reset</text><rect x="25" y="240" width="255" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="152.5" y="280.5" font-size="23" fill="#8de0cf" text-anchor="middle">DONE</text><path d="M280,272 L420,272" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="280" font-size="24" fill="#8de0cf" text-anchor="start">observe → reap</text></g></svg>
