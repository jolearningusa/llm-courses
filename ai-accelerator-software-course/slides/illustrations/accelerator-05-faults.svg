<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-05-faults-title accelerator-05-faults-desc" style="display:block;width:100%;height:auto"><title id="accelerator-05-faults-title">Faults at different execution boundaries</title><desc id="accelerator-05-faults-desc">The injection point determines the required recovery evidence. Admission Execution Notification No slots / allocation Reject, ledger unchanged DMA error / hang Error reap / watchdog reset Dropped IRQ Done → poll → reap</desc><defs><marker id="accelerator-05-faults-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="180.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">Admission</text><rect x="400" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">Execution</text><rect x="770" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="920.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">Notification</text><path d="M330,127 L400,127" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M700,127 L770,127" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="180" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">No slots / allocation</text><path d="M180,50 L180,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M180,160 L180,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="180" y="275" font-size="21" fill="#f1c979" text-anchor="middle">Reject, ledger unchanged</text><text x="550" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">DMA error / hang</text><path d="M550,50 L550,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M550,160 L550,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="550" y="275" font-size="21" fill="#f1c979" text-anchor="middle">Error reap / watchdog reset</text><text x="920" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">Dropped IRQ</text><path d="M920,50 L920,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M920,160 L920,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="920" y="275" font-size="21" fill="#f1c979" text-anchor="middle">Done → poll → reap</text></g></svg>
