<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-reap-title accelerator-04-reap-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-reap-title">Completion, observation and reclamation</title><desc id="accelerator-04-reap-desc">Reap releases the slot and pins exactly once. Device done pins + slot held Host observed pins + slot held Reaped pins + slot released Ownership persists after device completion double reap: reject</desc><defs><marker id="accelerator-04-reap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="175.0" y="85.5" font-size="23" fill="#8bbcff" text-anchor="middle">Device done</text><text x="175" y="175" font-size="21" fill="#f1c979" text-anchor="middle">pins + slot held</text><path d="M325,78 L390,78" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-reap-arrow)"/><rect x="390" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="85.5" font-size="23" fill="#8bbcff" text-anchor="middle">Host observed</text><text x="540" y="175" font-size="21" fill="#f1c979" text-anchor="middle">pins + slot held</text><path d="M690,78 L755,78" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-reap-arrow)"/><rect x="755" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="905.0" y="85.5" font-size="23" fill="#8de0cf" text-anchor="middle">Reaped</text><text x="905" y="175" font-size="21" fill="#8de0cf" text-anchor="middle">pins + slot released</text><rect x="25" y="215" width="665" height="36" rx="4" fill="#192d3d" stroke="#f1c979" stroke-width="2"/><text x="357.5" y="241" font-size="21" fill="#f1c979" text-anchor="middle">Ownership persists after device completion</text><text x="865" y="300" font-size="24" fill="#ff9e9e" text-anchor="middle">double reap: reject</text></g></svg>
