<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-independent-title accelerator-00-independent-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-independent-title">Independent proposal and acceptance</title><desc id="accelerator-00-independent-desc">The proposer cannot rewrite the frozen contract. AI proposer Candidate patch Independent evaluator Frozen contract + tests Accept / reject + raw logs Keep prompts, diffs and failed controls</desc><defs><marker id="accelerator-00-independent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="120" width="220" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="163.0" font-size="23" fill="#8bbcff" text-anchor="middle">AI proposer</text><rect x="380" y="120" width="235" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="497.5" y="163.0" font-size="23" fill="#8bbcff" text-anchor="middle">Candidate patch</text><path d="M250,155 L380,155" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><rect x="760" y="120" width="290" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="905.0" y="163.0" font-size="23" fill="#8de0cf" text-anchor="middle">Independent evaluator</text><path d="M615,155 L760,155" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><rect x="760" y="10" width="290" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="905.0" y="48.0" font-size="23" fill="#f1c979" text-anchor="middle">Frozen contract + tests</text><path d="M905,70 L905,120" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerat