<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-03-title accelerator-03-desc" style="display:block;width:100%;height:auto"><title id="accelerator-03-title">Firmware states and guarded transitions</title><desc id="accelerator-03-desc">Only a supported boot enters READY. Recovery returns through RESET. RESET READY FAULT supported boot watchdog boot rejected quiesce + reset, generation += 1 READY may also reset through the same quiescence contract</desc><defs><marker id="accelerator-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="100" width="230" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="143.0" font-size="23" fill="#8bbcff" text-anchor="middle">RESET</text><rect x="435" y="100" width="230" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="143.0" font-size="23" fill="#8de0cf" text-anchor="middle">READY</text><rect x="845" y="100" width="230" height="70" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="960.0" y="143.0" font-size="23" fill="#ff9e9e" text-anchor="middle">FAULT</text><path d="M255,135 L435,135" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-arrow)"/><text x="345" y="85" font-size="22" fill="#8de0cf" text-anchor="middle">supported boot</text><path d="M665,135 L845,135" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-03-arrow)"/><text x="755" y="85" font-size="22" fill="#ff9e9e" text-anchor="middle">watchdog</text><path d="M140,100 L140,28 L960,28 L960,100" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-03-arrow)"/><text x="550" y="24" font-size="21" fill="#ff9e9e" text-anchor="middle">boot rejected</text><path d="M960,170 L960,260 L140,260 L140,170" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerator-03-arrow)"/><text x="550" y="245" font-size="22" fill="#f1c979" text-anchor="middle">quiesce + reset, generation += 1</text><text x="550" y="320" font-size="21" fill="#b7c7df" text-anchor="middle">READY may also reset through the same quiescence contract</text></g></svg>
