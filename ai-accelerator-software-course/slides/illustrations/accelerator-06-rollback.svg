<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-06-rollback-title accelerator-06-rollback-desc" style="display:block;width:100%;height:auto"><title id="accelerator-06-rollback-title">A safe rollback boundary</title><desc id="accelerator-06-rollback-desc">Old device access must stop before memory or artifacts are replaced. Stop admission Drain or quiesce Restore artifact Verify fresh work No old DMA access across this boundary</desc><defs><marker id="accelerator-06-rollback-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="400" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="225.0" y="70.5" font-size="23" fill="#f1c979" text-anchor="middle">Stop admission</text><rect x="640" y="30" width="400" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="840.0" y="70.5" font-size="23" fill="#f1c979" text-anchor="middle">Drain or quiesce</text><rect x="640" y="235" width="400" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="840.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">Restore artifact</text><rect x="25" y="235" width="400" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="225.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">Verify fresh work</text><path d="M425,62 L640,62" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-rollback-arrow)"/><path d="M840,95 L840,235" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-rollback-arrow)"/><path d="M640,267 L425,267" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-06-rollback-arrow)"/><text x="550" y="170" font-size="24" fill="#ff9e9e" text-anchor="middle">No old DMA access across this boundary</text></g></svg>
