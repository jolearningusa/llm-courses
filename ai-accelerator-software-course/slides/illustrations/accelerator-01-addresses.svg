<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-01-addresses-title accelerator-01-addresses-desc" style="display:block;width:100%;height:auto"><title id="accelerator-01-addresses-title">Two address paths to one RAM buffer</title><desc id="accelerator-01-addresses-desc">An integer lab handle is neither a CPU pointer nor a DMA address. CPU virtual address X RAM buffer physical Y Device DMA address Z IOMMU CPU MMU Z maps to Y dma_map_* sets up the device view; IOMMU translation is platform-dependent.</desc><defs><marker id="accelerator-01-addresses-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="20" y="35" width="220" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="130.0" y="63.5" font-size="23" fill="#8bbcff" text-anchor="middle">CPU virtual</text><text x="130.0" y="92.5" font-size="23" fill="#8bbcff" text-anchor="middle">address X</text><rect x="435" y="120" width="230" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="156.0" font-size="23" fill="#8de0cf" text-anchor="middle">RAM buffer</text><text x="550.0" y="185.0" font-size="23" fill="#8de0cf" text-anchor="middle">physical Y</text><rect x="855" y="35" width="225" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="967.5" y="63.5" font-size="23" fill="#8bbcff" text-anchor="middle">Device DMA</text><text x="967.5" y="92.5" font-size="23" fill="#8bbcff" text-anchor="middle">address Z</text><rect x="855" y="220" width="225" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="967.5" y="258.0" font-size="23" fill="#f1c979" text-anchor="middle">IOMMU</text><path d="M240,70 L550,70 L550,120" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-addresses-arrow)"/><text x="310" y="48" font-size="22" fill="#eef4ff" text-anchor="start">CPU MMU</text><path d="M968,105 L968,220" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-addresses-arrow)"/><path d="M855,250 L665,250" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-addresses-arrow)"/><path d="M665,250 L665,190" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-addresses-arrow)"/><text x="720" y="232" font-size="21" fill="#f1c979" text-anchor="middle">Z maps to Y</text><text x="25" y="305" font-size="22" fill="#eef4ff" text-anchor="start">dma_map_* sets up the device view; IOMMU translation is platform-dependent.</text></g></svg>
