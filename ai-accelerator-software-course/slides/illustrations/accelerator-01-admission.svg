<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-01-admission-title accelerator-01-admission-desc" style="display:block;width:100%;height:auto"><title id="accelerator-01-admission-title">Validation before resource commitment</title><desc id="accelerator-01-admission-desc">Every rejection preserves the original queue and pin ledger. Packet arrives Fields + bounds Generation + owners Capacity Any rejection: no pins, no slot mutation All pass: commit pins + slot</desc><defs><marker id="accelerator-01-admission-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="25" y="35" font-size="25" fill="#8de0cf" text-anchor="start">Packet arrives</text><rect x="25" y="85" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="175.0" y="125.5" font-size="23" fill="#8bbcff" text-anchor="middle">Fields + bounds</text><path d="M175,150 L175,205" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><path d="M325,117 L390,117" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><rect x="390" y="85" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="125.5" font-size="23" fill="#8bbcff" text-anchor="middle">Generation + owners</text><path d="M540,150 L540,205" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><path d="M690,117 L755,117" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><rect x="755" y="85" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="905.0" y="125.5" font-size="23" fill="#8bbcff" text-anchor="middle">Capacity</text><path d="M905,150 L905,205" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><path d="M175,205 L905,205" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="550" y="245" font-size="23" fill="#ff9e9e" text-anchor="middle">Any rejection: no pins, no slot mutation</text><path d="M1055,117 L1080,117 L1080,290 L825,290" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-01-admission-arrow)"/><text x="800" y="300" font-size="23" fill="#8de0cf" text-anchor="end">All pass: commit pins + slot</text></g></svg>
