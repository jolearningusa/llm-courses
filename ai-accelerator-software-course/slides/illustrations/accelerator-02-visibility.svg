<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-visibility-title accelerator-02-visibility-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-visibility-title">Output visibility before completion</title><desc id="accelerator-02-visibility-desc">The CPU model is atomic; a real target needs its documented ordering rules. Producer Observer Write output Publish completion ordering / visibility Read output Observe completion Real target: documented DMA / barrier / coherency contract</desc><defs><marker id="accelerator-02-visibility-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="50" font-size="24" fill="#8bbcff" text-anchor="start">Producer</text><text x="20" y="220" font-size="24" fill="#8de0cf" text-anchor="start">Observer</text><rect x="205" y="20" width="280" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="345.0" y="60.5" font-size="23" fill="#8bbcff" text-anchor="middle">Write output</text><rect x="700" y="20" width="340" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="870.0" y="60.5" font-size="23" fill="#8bbcff" text-anchor="middle">Publish completion</text><path d="M485,52 L700,52" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><text x="590" y="115" font-size="22" fill="#f1c979" text-anchor="middle">ordering / visibility</text><rect x="205" y="195" width="280" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="345.0" y="235.5" font-size="23" fill="#8de0cf" text-anchor="middle">Read output</text><rect x="700" y="195" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="870.0" y="235.5" font-size="23" fill="#8de0cf" text-anchor="middle">Observe completion</text><path d="M700,227 L485,227" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><path d="M870,85 L870,195" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><text x="550" y="315" font-size="23" fill="#f1c979" text-anchor="middle">Real target: documented DMA / barrier / coherency contract</text></g></svg>
