<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-scope-title accelerator-00-scope-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-scope-title">Four evidence scopes</title><desc id="accelerator-00-scope-desc">Choose the evidence path that can answer the claim. CPU model Packet / state / ownership Documentation API obligations Target device Named revision behavior Instruments Power / thermal boundary No scope jump</desc><defs><marker id="accelerator-00-scope-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="53" font-size="24" fill="#8de0cf" text-anchor="start">CPU model</text><path d="M245,45 L340,45" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="53" font-size="24" fill="#eef4ff" text-anchor="start">Packet / state / ownership</text><text x="20" y="131" font-size="24" fill="#8de0cf" text-anchor="start">Documentation</text><path d="M245,123 L340,123" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="131" font-size="24" fill="#eef4ff" text-anchor="start">API obligations</text><text x="20" y="209" font-size="24" fill="#8de0cf" text-anchor="start">Target device</text><path d="M245,201 L340,201" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="209" font-size="24" fill="#eef4ff" text-anchor="start">Named revision behavior</text><text x="20" y="287" font-size="24" fill="#8de0cf" text-anchor="start">Instruments</text><path d="M245,279 L340,279" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="287" font-size="24" fill="#eef4ff" text-anchor="start">Power / thermal boundary</text><path d="M1030,20 L1030,315" fill="none" stroke="#50617a" stroke-width="2.5"/><text x="1070" y="52" font-size="21" fill="#f1c979" text-anchor="middle">No</text><text x="1070" y="81" font-size="21" fill="#f1c979" text-anchor="middle">scope</text><text x="1070" y="110" font-size="21" fill="#f1c979" text-anchor="middle">jump</text></g></svg>
