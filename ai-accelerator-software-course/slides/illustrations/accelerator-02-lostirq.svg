<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-lostirq-title accelerator-02-lostirq-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-lostirq-title">Completed work with a lost interrupt</title><desc id="accelerator-02-lostirq-desc">Polling can recover notification; timeout alone releases nothing. Host Device Notification submit write + done IRQ lost wait: timeout poll done observed; reap allowed</desc><defs><marker id="accelerator-02-lostirq-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="155" y="25" font-size="24" fill="#8de0cf" text-anchor="middle">Host</text><path d="M155,45 L155,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="580" y="25" font-size="24" fill="#8de0cf" text-anchor="middle">Device</text><path d="M580,45 L580,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="980" y="25" font-size="24" fill="#8de0cf" text-anchor="middle">Notification</text><path d="M980,45 L980,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M155,75 L580,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-lostirq-arrow)"/><text x="350" y="63" font-size="22" fill="#eef4ff" text-anchor="middle">submit</text><text x="580" y="135" font-size="23" fill="#8de0cf" text-anchor="middle">write + done</text><path d="M580,165 L980,165" fill="none" stroke="#ff9e9e" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M841,156 L859,174" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M841,174 L859,156" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="800" y="150" font-size="22" fill="#ff9e9e" text-anchor="middle">IRQ lost</text><text x="155" y="205" font-size="22" fill="#f1c979" text-anchor="middle">wait: timeout</text><path d="M155,242 L580,242" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-lostirq-arrow)"/><text x="350" y="230" font-size="22" fill="#eef4ff" text-anchor="middle">poll</text><path d="M580,285 L155,285" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-lostirq-arrow)"/><text x="350" y="276" font-size="22" fill="#8de0cf" text-anchor="middle">done observed; reap allowed</text></g></svg>
