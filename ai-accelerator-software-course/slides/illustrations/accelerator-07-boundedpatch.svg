<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-07-boundedpatch-title accelerator-07-boundedpatch-desc" style="display:block;width:100%;height:auto"><title id="accelerator-07-boundedpatch-title">A bounded patch inside the stack</title><desc id="accelerator-07-boundedpatch-desc">Choose one boundary and name the guarantees you will preserve. Packet ABI Queue / ownership Firmware lifecycle Evidence / release Example: queued cancel cleanup one invariant, one patch Preserve ABI + in-flight policy Keep real DMA outside CPU claims</desc><defs><marker id="accelerator-07-boundedpatch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="10" width="400" height="60" rx="4" fill="#101927" stroke="#b7c7df" stroke-width="2"/><text x="225.0" y="48.0" font-size="23" fill="#b7c7df" text-anchor="middle">Packet ABI</text><rect x="25" y="90" width="400" height="60" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="225.0" y="128.0" font-size="23" fill="#8de0cf" text-anchor="middle">Queue / ownership</text><rect x="25" y="170" width="400" height="60" rx="4" fill="#101927" stroke="#b7c7df" stroke-width="2"/><text x="225.0" y="208.0" font-size="23" fill="#b7c7df" text-anchor="middle">Firmware lifecycle</text><rect x="25" y="250" width="400" height="60" rx="4" fill="#101927" stroke="#b7c7df" stroke-width="2"/><text x="225.0" y="288.0" font-size="23" fill="#b7c7df" text-anchor="middle">Evidence / release</text><rect x="600" y="70" width="460" height="100" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="830" y="109" font-size="24" fill="#8de0cf" text-anchor="middle">Example: queued cancel cleanup</text><text x="830" y="143" font-size="22" fill="#eef4ff" text-anchor="middle">one invariant, one patch</text><path d="M425,120 L600,120" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-07-boundedpatch-arrow)"/><text x="640" y="225" font-size="22" fill="#eef4ff" text-anchor="start">Preserve ABI + in-flight policy</text><text x="640" y="254" font-size="22" fill="#eef4ff" text-anchor="start">Keep real DMA outside CPU claims</text></g></svg>
