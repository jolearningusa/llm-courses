<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-01-packet-title accelerator-01-packet-desc" style="display:block;width:100%;height:auto"><title id="accelerator-01-packet-title">The 24-byte teaching descriptor</title><desc id="accelerator-01-packet-desc">Little-endian ABI v1. Field widths are drawn to scale. Byte offsets (little-endian) 0 ABI 1 OP 2 RSV 4 generation 8 src 12 dst 16 length 20 cookie 24 &lt;BBHIIIII 1 + 1 + 2 + 5 × 4 = 24 bytes ABI=1   OP=1/2   RSV=0   handles are model IDs</desc><defs><marker id="accelerator-01-packet-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="25" y="28" font-size="23" fill="#8de0cf" text-anchor="start">Byte offsets (little-endian)</text><rect x="65" y="95" width="40" height="78" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="65" y="77" font-size="21" fill="#b7c7df" text-anchor="start">0</text><text x="85.0" y="140" font-size="19" fill="#eef4ff" text-anchor="middle">ABI</text><rect x="105" y="95" width="40" height="78" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="105" y="77" font-size="21" fill="#b7c7df" text-anchor="start">1</text><text x="125.0" y="140" font-size="19" fill="#eef4ff" text-anchor="middle">OP</text><rect x="145" y="95" width="80" height="78" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145" y="77" font-size="21" fill="#b7c7df" text-anchor="start">2</text><text x="185.0" y="140" font-size="19" fill="#eef4ff" text-anchor="middle">RSV</text><rect x="225" y="95" width="160" height="78" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="225" y="77" font-size="21" fill="#b7c7df" text-anchor="start">4</text><text x="305.0" y="140" font-size="23" fill="#eef4ff" text-anchor="middle">generation</text><rect x="385" y="95" width="160" height="78" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="385" y="77" font-size="21" fill="#b7c7df" text-anchor="start">8</text><text x="465.0" y="140" font-size="23" fill="#eef4ff" text-anchor="middle">src</text><rect x="545" y="95" width="160" height="78" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="545" y="77" font-size="21" fill="#b7c7df" text-anchor="start">12</text><text x="625.0" y="140" font-size="23" fill="#eef4ff" text-anchor="middle">dst</text><rect x="705" y="95" width="160" height="78" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="705" y="77" font-size="21" fill="#b7c7df" text-anchor="start">16</text><text x="785.0" y="140" font-size="23" fill="#eef4ff" text-anchor="middle">length</text><rect x="865" y="95" width="160" height="78" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="865" y="77" font-size="21" fill="#b7c7df" text-anchor="start">20</text><text x="945.0" y="140" font-size="23" fill="#eef4ff" text-anchor="middle">cookie</text><text x="1025" y="77" font-size="21" fill="#b7c7df" text-anchor="start">24</text><text x="65" y="225" font-size="26" fill="#f1c979" text-anchor="start">&lt;BBHIIIII</text><text x="400" y="225" font-size="24" fill="#eef4ff" text-anchor="start">1 + 1 + 2 + 5 × 4 = 24 bytes</text><text x="65" y="290" font-size="23" fill="#eef4ff" text-anchor="start">ABI=1   OP=1/2   RSV=0   handles are model IDs</text></g></svg>
