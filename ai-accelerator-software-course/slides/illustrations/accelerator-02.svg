<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-title accelerator-02-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-title">Ownership across submission and reap</title><desc id="accelerator-02-desc">Device done, host observed and safe reuse are distinct events. Write Submit Run Done Observe Reap Host Device Pins Exclusive ownership retained Logical event order; distances are not elapsed time</desc><defs><marker id="accelerator-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="190" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Write</text><path d="M190,55 L190,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="350" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Submit</text><path d="M350,55 L350,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="510" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Run</text><path d="M510,55 L510,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="670" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Done</text><path d="M670,55 L670,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="830" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Observe</text><path d="M830,55 L830,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="990" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">Reap</text><path d="M990,55 L990,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="15" y="113" font-size="24" fill="#8bbcff" text-anchor="start">Host</text><text x="15" y="193" font-size="24" fill="#8de0cf" text-anchor="start">Device</text><text x="15" y="268" font-size="24" fill="#f1c979" text-anchor="start">Pins</text><path d="M190,105 L350,105" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><path d="M350,105 L350,185 L670,185 L670,105 L990,105" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><rect x="350" y="240" width="640" height="36" rx="4" fill="#192d3d" stroke="#f1c979" stroke-width="2"/><text x="670.0" y="266" font-size="21" fill="#f1c979" text-anchor="middle">Exclusive ownership retained</text><text x="550" y="325" font-size="22" fill="#b7c7df" text-anchor="middle">Logical event order; distances are not elapsed time</text></g></svg>
