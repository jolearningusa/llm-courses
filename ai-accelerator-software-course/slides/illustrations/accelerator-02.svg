<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-title accelerator-02-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-title">The ownership timeline</title><desc id="accelerator-02-desc">Conceptual order and responsibility boundaries, not measured timing or a hardware schematic.</desc><defs><marker id="accelerator-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="110" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="149.0" font-size="22" fill="#8bbcff" text-anchor="middle">Host writes</text><path d="M272.0,142 L293.0,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><rect x="297.0" y="110" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="149.0" font-size="22" fill="#8bbcff" text-anchor="middle">Submit / pin</text><path d="M539.0,142 L560.0,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><rect x="564.0" y="110" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="149.0" font-size="22" fill="#8bbcff" text-anchor="middle">Device finishes</text><path d="M806.0,142 L827.0,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><rect x="831.0" y="110" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="149.0" font-size="22" fill="#8bbcff" text-anchor="middle">Observe / reap</text></g></svg>