<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-06-title accelerator-06-desc" style="display:block;width:100%;height:auto"><title id="accelerator-06-title">Functional pass and missing target evidence</title><desc id="accelerator-06-desc">Use separate status cells for identity, functional, device and physical evidence. Released evidence Identity Functional Device Physical CPU report RECORDED PASS NOT RUN NOT RUN Hardware gate Promotion blocked: missing target evidence A functional pass does not fill unexecuted target cells.</desc><defs><marker id="accelerator-06-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="25" font-size="24" fill="#8de0cf" text-anchor="start">Released evidence</text><text x="345" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">Identity</text><text x="555" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">Functional</text><text x="765" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">Device</text><text x="975" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">Physical</text><text x="25" y="150" font-size="23" fill="#eef4ff" text-anchor="start">CPU report</text><rect x="245" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="345.0" y="148.0" font-size="23" fill="#8de0cf" text-anchor="middle">RECORDED</text><rect x="455" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="555.0" y="148.0" font-size="23" fill="#8de0cf" text-anchor="middle">PASS</text><rect x="665" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="765.0" y="148.0" font-size="23" fill="#f1c979" text-anchor="middle">NOT RUN</text><rect x="875" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="975.0" y="148.0" font-size="23" fill="#f1c979" text-anchor="middle">NOT RUN</text><text x="25" y="245" font-size="23" fill="#eef4ff" text-anchor="start">Hardware gate</text><text x="670" y="245" font-size="25" fill="#ff9e9e" text-anchor="middle">Promotion blocked: missing target evidence</text><text x="550" y="315" font-size="23" fill="#b7c7df" text-anchor="middle">A functional pass does not fill unexecuted target cells.</text></g></svg>
