<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-05-controls-title accelerator-05-controls-desc" style="display:block;width:100%;height:auto"><title id="accelerator-05-controls-title">Controls that test the evaluator</title><desc id="accelerator-05-controls-desc">A useful evaluator accepts legal changes and rejects broken ones. Valid baseline Same evaluator accept Early-free mutant Same evaluator reject Legal cleanup Same evaluator accept</desc><defs><marker id="accelerator-05-controls-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="25" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="195.0" y="65.5" font-size="23" fill="#8de0cf" text-anchor="middle">Valid baseline</text><path d="M365,57 L540,57" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="25" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="65.5" font-size="23" fill="#8bbcff" text-anchor="middle">Same evaluator</text><path d="M770,57 L900,57" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="65" font-size="25" fill="#8de0cf" text-anchor="start">accept</text><rect x="25" y="130" width="340" height="65" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="195.0" y="170.5" font-size="23" fill="#ff9e9e" text-anchor="middle">Early-free mutant</text><path d="M365,162 L540,162" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="130" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="170.5" font-size="23" fill="#8bbcff" text-anchor="middle">Same evaluator</text><path d="M770,162 L900,162" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="170" font-size="25" fill="#ff9e9e" text-anchor="start">reject</text><rect x="25" y="235" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="195.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">Legal cleanup</text><path d="M365,267 L540,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="235" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="275.5" font-size="23" fill="#8bbcff" text-anchor="middle">Same evaluator</text><path d="M770,267 L900,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="275" font-size="25" fill="#8de0cf" text-anchor="start">accept</text></g></svg>
