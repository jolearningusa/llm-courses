<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-06-title accelerator-06-desc" style="display:block;width:100%;height:auto"><title id="accelerator-06-title">功能通过与目标证据缺失</title><desc id="accelerator-06-desc">分别记录身份、功能、设备与物理证据的状态。 已发布的证据 身份 功能 设备 物理 CPU 报告 已记录 通过 未运行 未运行 硬件门槛 缺少目标证据，不能放行 功能通过不会自动填补未执行的目标测试。</desc><defs><marker id="accelerator-06-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="25" font-size="24" fill="#8de0cf" text-anchor="start">已发布的证据</text><text x="345" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">身份</text><text x="555" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">功能</text><text x="765" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">设备</text><text x="975" y="80" font-size="23" fill="#eef4ff" text-anchor="middle">物理</text><text x="25" y="150" font-size="23" fill="#eef4ff" text-anchor="start">CPU 报告</text><rect x="245" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="345.0" y="148.0" font-size="23" fill="#8de0cf" text-anchor="middle">已记录</text><rect x="455" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="555.0" y="148.0" font-size="23" fill="#8de0cf" text-anchor="middle">通过</text><rect x="665" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="765.0" y="148.0" font-size="23" fill="#f1c979" text-anchor="middle">未运行</text><rect x="875" y="110" width="200" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="975.0" y="148.0" font-size="23" fill="#f1c979" text-anchor="middle">未运行</text><text x="25" y="245" font-size="23" fill="#eef4ff" text-anchor="start">硬件门槛</text><text x="670" y="245" font-size="25" fill="#ff9e9e" text-anchor="middle">缺少目标证据，不能放行</text><text x="550" y="315" font-size="23" fill="#b7c7df" text-anchor="middle">功能通过不会自动填补未执行的目标测试。</text></g></svg>
