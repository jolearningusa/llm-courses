<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-independent-title accelerator-00-independent-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-independent-title">提议与验收分别负责</title><desc id="accelerator-00-independent-desc">候选实现的提议者不能修改已冻结的验收契约。 AI 提议者 候选修改 独立验收器 冻结契约与测试 接受 / 拒绝 + 原始日志 保留提示词、修改与错误对照</desc><defs><marker id="accelerator-00-independent-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="120" width="220" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="163.0" font-size="23" fill="#8bbcff" text-anchor="middle">AI 提议者</text><rect x="380" y="120" width="235" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="497.5" y="163.0" font-size="23" fill="#8bbcff" text-anchor="middle">候选修改</text><path d="M250,155 L380,155" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><rect x="760" y="120" width="290" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="905.0" y="163.0" font-size="23" fill="#8de0cf" text-anchor="middle">独立验收器</text><path d="M615,155 L760,155" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><rect x="760" y="10" width="290" height="60" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="905.0" y="48.0" font-size="23" fill="#f1c979" text-anchor="middle">冻结契约与测试</text><path d="M905,70 L905,120" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><path d="M905,190 L905,245" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-00-independent-arrow)"/><text x="905" y="280" font-size="24" fill="#8de0cf" text-anchor="middle">接受 / 拒绝 + 原始日志</text><path d="M490,120 L490,40 L735,40" fill="none" stroke="#ff9e9e" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M621,31 L639,49" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M621,49 L639,31" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="380" y="315" font-size="23" fill="#eef4ff" text-anchor="start">保留提示词、修改与错误对照</text></g></svg>
