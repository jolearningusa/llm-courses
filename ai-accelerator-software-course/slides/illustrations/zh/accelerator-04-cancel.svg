<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-cancel-title accelerator-04-cancel-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-cancel-title">取消操作取决于命令状态</title><desc id="accelerator-04-cancel-desc">本模型明确不支持取消已在执行中的命令。 排队中 取消 → 观察 → 收取 执行中 拒绝取消；等待完成或复位 已完成 观察 → 收取</desc><defs><marker id="accelerator-04-cancel-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="255" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="152.5" y="70.5" font-size="23" fill="#8de0cf" text-anchor="middle">排队中</text><path d="M280,62 L420,62" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="70" font-size="24" fill="#8de0cf" text-anchor="start">取消 → 观察 → 收取</text><rect x="25" y="135" width="255" height="65" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="152.5" y="175.5" font-size="23" fill="#ff9e9e" text-anchor="middle">执行中</text><path d="M280,167 L420,167" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="175" font-size="24" fill="#ff9e9e" text-anchor="start">拒绝取消；等待完成或复位</text><rect x="25" y="240" width="255" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="152.5" y="280.5" font-size="23" fill="#8de0cf" text-anchor="middle">已完成</text><path d="M280,272 L420,272" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-cancel-arrow)"/><text x="450" y="280" font-size="24" fill="#8de0cf" text-anchor="start">观察 → 收取</text></g></svg>
