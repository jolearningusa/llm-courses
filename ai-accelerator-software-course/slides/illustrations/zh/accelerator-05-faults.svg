<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-05-faults-title accelerator-05-faults-desc" style="display:block;width:100%;height:auto"><title id="accelerator-05-faults-title">在不同执行边界注入故障</title><desc id="accelerator-05-faults-desc">注入位置决定必须收集哪一种恢复证据。 准入 执行 通知 槽位 / 分配不足 拒绝，资源记录不变 DMA 错误 / 挂起 错误收取 / 看门狗复位 丢失中断 完成 → 轮询 → 收取</desc><defs><marker id="accelerator-05-faults-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="180.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">准入</text><rect x="400" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">执行</text><rect x="770" y="95" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="920.0" y="135.5" font-size="23" fill="#8bbcff" text-anchor="middle">通知</text><path d="M330,127 L400,127" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M700,127 L770,127" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="180" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">槽位 / 分配不足</text><path d="M180,50 L180,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M180,160 L180,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="180" y="275" font-size="21" fill="#f1c979" text-anchor="middle">拒绝，资源记录不变</text><text x="550" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">DMA 错误 / 挂起</text><path d="M550,50 L550,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M550,160 L550,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="550" y="275" font-size="21" fill="#f1c979" text-anchor="middle">错误收取 / 看门狗复位</text><text x="920" y="40" font-size="21" fill="#ff9e9e" text-anchor="middle">丢失中断</text><path d="M920,50 L920,95" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><path d="M920,160 L920,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-faults-arrow)"/><text x="920" y="275" font-size="21" fill="#f1c979" text-anchor="middle">完成 → 轮询 → 收取</text></g></svg>
