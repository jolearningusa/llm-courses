<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-reap-title accelerator-04-reap-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-reap-title">完成、观察与资源回收</title><desc id="accelerator-04-reap-desc">收取完成只释放一次槽位与固定资源。 设备完成 仍占固定资源与槽位 主机观察到 仍占固定资源与槽位 已收取 释放固定资源与槽位 设备完成后，所有权仍然保留 重复收取：拒绝</desc><defs><marker id="accelerator-04-reap-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="175.0" y="85.5" font-size="23" fill="#8bbcff" text-anchor="middle">设备完成</text><text x="175" y="175" font-size="21" fill="#f1c979" text-anchor="middle">仍占固定资源与槽位</text><path d="M325,78 L390,78" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-reap-arrow)"/><rect x="390" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="85.5" font-size="23" fill="#8bbcff" text-anchor="middle">主机观察到</text><text x="540" y="175" font-size="21" fill="#f1c979" text-anchor="middle">仍占固定资源与槽位</text><path d="M690,78 L755,78" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-reap-arrow)"/><rect x="755" y="45" width="300" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="905.0" y="85.5" font-size="23" fill="#8de0cf" text-anchor="middle">已收取</text><text x="905" y="175" font-size="21" fill="#8de0cf" text-anchor="middle">释放固定资源与槽位</text><rect x="25" y="215" width="665" height="36" rx="4" fill="#192d3d" stroke="#f1c979" stroke-width="2"/><text x="357.5" y="241" font-size="21" fill="#f1c979" text-anchor="middle">设备完成后，所有权仍然保留</text><text x="865" y="300" font-size="24" fill="#ff9e9e" text-anchor="middle">重复收取：拒绝</text></g></svg>
