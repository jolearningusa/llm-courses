<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-05-bounded-title accelerator-05-bounded-desc" style="display:block;width:100%;height:auto"><title id="accelerator-05-bounded-title">两步即可触发的所有权反例</title><desc id="accelerator-05-bounded-desc">深度一无法发现“提交后释放”；需要说明搜索边界。 空闲 + 内存有效 已提交 + 内存有效 submit 工作未结束 + 已释放 错误规则 允许释放 安全规则：拒绝释放 深度 0 深度 1 深度 2：反例</desc><defs><marker id="accelerator-05-bounded-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="70.5" font-size="23" fill="#8bbcff" text-anchor="middle">空闲 + 内存有效</text><rect x="425" y="30" width="290" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="570.0" y="70.5" font-size="23" fill="#8bbcff" text-anchor="middle">已提交 + 内存有效</text><path d="M255,62 L425,62" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-bounded-arrow)"/><text x="340" y="40" font-size="21" fill="#eef4ff" text-anchor="middle">submit</text><rect x="795" y="235" width="290" height="65" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="940.0" y="275.5" font-size="23" fill="#ff9e9e" text-anchor="middle">工作未结束 + 已释放</text><path d="M715,62 L940,62 L940,235" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-05-bounded-arrow)"/><text x="960" y="140" font-size="22" fill="#ff9e9e" text-anchor="start">错误规则</text><text x="960" y="169" font-size="22" fill="#ff9e9e" text-anchor="start">允许释放</text><text x="555" y="175" font-size="23" fill="#8de0cf" text-anchor="middle">安全规则：拒绝释放</text><path d="M365,10 L365,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="175" y="315" font-size="21" fill="#eef4ff" text-anchor="start">深度 0</text><text x="480" y="315" font-size="21" fill="#eef4ff" text-anchor="start">深度 1</text><text x="805" y="330" font-size="21" fill="#ff9e9e" text-anchor="start">深度 2：反例</text></g></svg>
