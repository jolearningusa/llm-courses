<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-05-controls-title accelerator-05-controls-desc" style="display:block;width:100%;height:auto"><title id="accelerator-05-controls-title">用对照检查验收器</title><desc id="accelerator-05-controls-desc">有效的验收器既能接受合法变更，也能拒绝错误实现。 有效基线 相同验收器 接受 过早释放的错误变体 相同验收器 拒绝 合法的清理变更 相同验收器 接受</desc><defs><marker id="accelerator-05-controls-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="25" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="195.0" y="65.5" font-size="23" fill="#8de0cf" text-anchor="middle">有效基线</text><path d="M365,57 L540,57" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="25" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="65.5" font-size="23" fill="#8bbcff" text-anchor="middle">相同验收器</text><path d="M770,57 L900,57" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="65" font-size="25" fill="#8de0cf" text-anchor="start">接受</text><rect x="25" y="130" width="340" height="65" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="195.0" y="170.5" font-size="23" fill="#ff9e9e" text-anchor="middle">过早释放的错误变体</text><path d="M365,162 L540,162" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="130" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="170.5" font-size="23" fill="#8bbcff" text-anchor="middle">相同验收器</text><path d="M770,162 L900,162" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="170" font-size="25" fill="#ff9e9e" text-anchor="start">拒绝</text><rect x="25" y="235" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="195.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">合法的清理变更</text><path d="M365,267 L540,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><rect x="540" y="235" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="655.0" y="275.5" font-size="23" fill="#8bbcff" text-anchor="middle">相同验收器</text><path d="M770,267 L900,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-05-controls-arrow)"/><text x="940" y="275" font-size="25" fill="#8de0cf" text-anchor="start">接受</text></g></svg>
