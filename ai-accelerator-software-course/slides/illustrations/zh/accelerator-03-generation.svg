<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-03-generation-title accelerator-03-generation-desc" style="display:block;width:100%;height:auto"><title id="accelerator-03-generation-title">相同 cookie，不同代次</title><desc id="accelerator-03-generation-desc">代次能拒绝旧事件，却不能停止实际的 DMA 写入。 复位前 票据 (g=4, cookie=7) 复位 → g=5 票据 (g=5, cookie=7) 拒绝旧事件 新的身份 通过二元组标识工作；仅靠 cookie 不足。</desc><defs><marker id="accelerator-03-generation-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="25" y="40" font-size="24" fill="#eef4ff" text-anchor="start">复位前</text><rect x="25" y="80" width="320" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="185.0" y="123.0" font-size="23" fill="#8bbcff" text-anchor="middle">票据 (g=4, cookie=7)</text><rect x="420" y="80" width="260" height="70" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="123.0" font-size="23" fill="#f1c979" text-anchor="middle">复位 → g=5</text><path d="M345,115 L420,115" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-generation-arrow)"/><rect x="765" y="80" width="310" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="920.0" y="123.0" font-size="23" fill="#8de0cf" text-anchor="middle">票据 (g=5, cookie=7)</text><path d="M680,115 L765,115" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-generation-arrow)"/><path d="M185,150 L185,245 L740,245" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-03-generation-arrow)"/><path d="M701,236 L719,254" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M701,254 L719,236" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="790" y="253" font-size="23" fill="#ff9e9e" text-anchor="start">拒绝旧事件</text><path d="M920,150 L920,190" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-03-generation-arrow)"/><text x="920" y="213" font-size="23" fill="#8de0cf" text-anchor="middle">新的身份</text><text x="25" y="320" font-size="24" fill="#eef4ff" text-anchor="start">通过二元组标识工作；仅靠 cookie 不足。</text></g></svg>
