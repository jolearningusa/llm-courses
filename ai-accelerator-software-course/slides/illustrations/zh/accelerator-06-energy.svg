<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-06-energy-title accelerator-06-energy-desc" style="display:block;width:100%;height:auto"><title id="accelerator-06-energy-title">功率边界与测量窗口</title><desc id="accelerator-06-energy-desc">P(t) 为示意曲线，并非实测数据；要对齐完成工作与传感器范围。 指定测量边界 板卡 / 设备 传感器范围 P(t) t E = ∫ P(t) dt t₀ t₁ 对齐的工作完成窗口</desc><defs><marker id="accelerator-06-energy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="30" font-size="23" fill="#8de0cf" text-anchor="start">指定测量边界</text><rect x="25" y="65" width="310" height="235" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2" stroke-dasharray="7 5"/><rect x="70" y="130" width="220" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="180.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">板卡 / 设备</text><text x="180" y="260" font-size="22" fill="#f1c979" text-anchor="middle">传感器范围</text><path d="M445,285 L1060,285" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-energy-arrow)"/><path d="M445,285 L445,45" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-energy-arrow)"/><text x="415" y="40" font-size="24" fill="#eef4ff" text-anchor="start">P(t)</text><text x="1065" y="320" font-size="24" fill="#eef4ff" text-anchor="start">t</text><path d="M505,285 L505,240 L570,170 L650,190 L735,110 L820,145 L895,130 L1000,225 L1000,285 Z" fill="#244747"/><path d="M505,240 L570,170 L650,190 L735,110 L820,145 L895,130 L1000,225" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="760" y="65" font-size="26" fill="#f1c979" text-anchor="middle">E = ∫ P(t) dt</text><text x="505" y="320" font-size="23" fill="#eef4ff" text-anchor="start">t₀</text><text x="1000" y="32