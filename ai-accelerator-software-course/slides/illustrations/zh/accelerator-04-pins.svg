<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-pins-title accelerator-04-pins-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-pins-title">缓冲区的独占所有权</title><desc id="accelerator-04-pins-desc">源与目标缓冲区都要固定到安全收取完成或静止复位。 主机 API 设备命令 源缓冲区 目标缓冲区 固定期间禁止 读 / 写 / 释放 独占固定</desc><defs><marker id="accelerator-04-pins-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="230" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="70.5" font-size="23" fill="#8bbcff" text-anchor="middle">主机 API</text><rect x="760" y="30" width="310" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="915.0" y="70.5" font-size="23" fill="#8de0cf" text-anchor="middle">设备命令</text><rect x="390" y="140" width="270" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="525.0" y="180.5" font-size="23" fill="#f1c979" text-anchor="middle">源缓冲区</text><path d="M915,95 L915,172 L660,172" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-pins-arrow)"/><path d="M140,95 L140,172 L365,172" fill="none" stroke="#ff9e9e" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M321,163 L339,181" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M321,181 L339,163" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><rect x="390" y="250" width="270" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="525.0" y="290.5" font-size="23" fill="#f1c979" text-anchor="middle">目标缓冲区</text><path d="M915,95 L915,282 L660,282" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-04-pins-arrow)"/><path d="M140,95 L140,282 L365,282" fill="none" stroke="#ff9e9e" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M321,273 L339,291" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M321,291 L339,273" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="165" y="217" font-size="21" fill="#ff9e9e" text-anchor="start">固定期间禁止</text><text x="165" y="246" font-size="21" fill="#ff9e9e" text-anchor="start">读 / 写 / 释放</text><text x="795" y="220" font-size="23" fill="#f1c979" text-anchor="start">独占固定</text></g></svg>
