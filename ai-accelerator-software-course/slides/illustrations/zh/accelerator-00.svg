<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-title accelerator-00-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-title">主机与设备的执行边界</title><desc id="accelerator-00-desc">沿图向下跟踪提交，再向上跟踪完成。 主机 设备 框架 / 编译器 Runtime：缓冲区与提交 驱动接口 固件 / 执行引擎 命令 完成通知</desc><defs><marker id="accelerator-00-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="25" y="30" font-size="24" fill="#8de0cf" text-anchor="start">主机</text><text x="25" y="270" font-size="24" fill="#8de0cf" text-anchor="start">设备</text><rect x="265" y="15" width="550" height="57" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="51.5" font-size="23" fill="#8bbcff" text-anchor="middle">框架 / 编译器</text><rect x="265" y="92" width="550" height="57" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="128.5" font-size="23" fill="#8bbcff" text-anchor="middle">Runtime：缓冲区与提交</text><rect x="265" y="169" width="550" height="57" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="205.5" font-size="23" fill="#8bbcff" text-anchor="middle">驱动接口</text><rect x="265" y="246" width="550" height="57" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="540.0" y="282.5" font-size="23" fill="#8bbcff" text-anchor="middle">固件 / 执行引擎</text><path d="M425,72 L425,92" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><path d="M670,92 L670,72" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><path d="M425,149 L425,169" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><path d="M670,169 L670,149" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><path d="M425,226 L425,246" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><path d="M670,246 L670,226" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-00-arrow)"/><text x="115" y="133" font-size="22" fill="#eef4ff" text-anchor="start">命令</text><text x="850" y="133" font-size="22" fill="#8de0cf" text-anchor="start">完成通知</text><path d="M20,236 L1080,236" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/></g></svg>
