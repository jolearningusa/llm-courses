<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-visibility-title accelerator-02-visibility-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-visibility-title">输出可见性先于完成发布</title><desc id="accelerator-02-visibility-desc">CPU 模型采用原子写入；真机需遵守平台的内存序规则。 生产者 观察者 写入输出 发布完成记录 顺序 / 可见性 读取输出 观察到完成 真机：使用文档规定的 DMA、屏障与一致性契约</desc><defs><marker id="accelerator-02-visibility-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="50" font-size="24" fill="#8bbcff" text-anchor="start">生产者</text><text x="20" y="220" font-size="24" fill="#8de0cf" text-anchor="start">观察者</text><rect x="205" y="20" width="280" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="345.0" y="60.5" font-size="23" fill="#8bbcff" text-anchor="middle">写入输出</text><rect x="700" y="20" width="340" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="870.0" y="60.5" font-size="23" fill="#8bbcff" text-anchor="middle">发布完成记录</text><path d="M485,52 L700,52" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><text x="590" y="115" font-size="22" fill="#f1c979" text-anchor="middle">顺序 / 可见性</text><rect x="205" y="195" width="280" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="345.0" y="235.5" font-size="23" fill="#8de0cf" text-anchor="middle">读取输出</text><rect x="700" y="195" width="340" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="870.0" y="235.5" font-size="23" fill="#8de0cf" text-anchor="middle">观察到完成</text><path d="M700,227 L485,227" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><path d="M870,85 L870,195" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-visibility-arrow)"/><text x="550" y="315" font-size="23" fill="#f1c979" text-anchor="middle">真机：使用文档规定的 DMA、屏障与一致性契约</text></g></svg>
