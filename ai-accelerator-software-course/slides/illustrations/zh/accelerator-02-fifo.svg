<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-fifo-title accelerator-02-fifo-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-fifo-title">FIFO 执行与未收取槽位</title><desc id="accelerator-02-fifo-desc">已完成的命令仍占用槽位，直到收取完成。 A：已完成 未收取 B：执行中 C：排队中 示例容量：3 个未收取槽位 D：提交被拒绝 收取 A 后才空出一个槽位 单个 FIFO 执行单元</desc><defs><marker id="accelerator-02-fifo-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="60" width="250" height="85" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="155.0" y="96.0" font-size="23" fill="#f1c979" text-anchor="middle">A：已完成</text><text x="155.0" y="125.0" font-size="23" fill="#f1c979" text-anchor="middle">未收取</text><rect x="330" y="60" width="250" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="455.0" y="110.5" font-size="23" fill="#8de0cf" text-anchor="middle">B：执行中</text><rect x="630" y="60" width="250" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="755.0" y="110.5" font-size="23" fill="#8bbcff" text-anchor="middle">C：排队中</text><path d="M280,102 L330,102" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-fifo-arrow)"/><path d="M580,102 L630,102" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-02-fifo-arrow)"/><text x="30" y="200" font-size="26" fill="#eef4ff" text-anchor="start">示例容量：3 个未收取槽位</text><rect x="35" y="250" width="290" height="60" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="180.0" y="288.0" font-size="23" fill="#ff9e9e" text-anchor="middle">D：提交被拒绝</text><text x="385" y="287" font-size="24" fill="#8de0cf" text-anchor="start">收取 A 后才空出一个槽位</text><text x="980" y="93" font-size="23" fill="#8de0cf" text-anchor="middle">单个</text><text x="980" y="122" font-size="23" fill="#8de0cf" text-anchor="middle">FIFO</text><text x="980" y="151" font-size="23" fill="#8de0cf" text-anchor="middle">执行单元</text></g></svg>
