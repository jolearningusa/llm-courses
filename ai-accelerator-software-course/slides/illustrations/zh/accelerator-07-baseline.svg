<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-07-baseline-title accelerator-07-baseline-desc" style="display:block;width:100%;height:auto"><title id="accelerator-07-baseline-title">基线与候选共用一个验收器</title><desc id="accelerator-07-baseline-desc">冻结留出输入，并保留被拒绝的错误对照。 基线版本 候选版本 冻结的验收器 留出用例 原始成对结果 契约、种子与统计口径相同</desc><defs><marker id="accelerator-07-baseline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="280" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="165.0" y="70.5" font-size="23" fill="#8bbcff" text-anchor="middle">基线版本</text><rect x="25" y="230" width="280" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="165.0" y="270.5" font-size="23" fill="#8de0cf" text-anchor="middle">候选版本</text><rect x="450" y="120" width="270" height="75" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="585.0" y="165.5" font-size="23" fill="#f1c979" text-anchor="middle">冻结的验收器</text><path d="M305,62 L365,62 L365,157 L450,157" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-07-baseline-arrow)"/><path d="M305,262 L365,262 L365,157" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-07-baseline-arrow)"/><rect x="820" y="20" width="260" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="950.0" y="60.5" font-size="23" fill="#f1c979" text-anchor="middle">留出用例</text><path d="M950,85 L950,105 L585,105 L585,120" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerator-07-baseline-arrow)"/><rect x="820" y="230" width="260" height="65" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="950.0" y="270.5" font-size="23" fill="#8de0cf" text-anchor="middle">原始成对结果</text><path d="M720,157 L950,157 L950,230" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-07-baseline-arrow)"/><text x="480" y="315" font-size="23" fill="#eef4ff" text-anchor="start">契约、种子与统计口径相同</text></g></svg>
