<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-02-title accelerator-02-desc" style="display:block;width:100%;height:auto"><title id="accelerator-02-title">从提交到收取完成的所有权</title><desc id="accelerator-02-desc">设备完成、主机观察到完成、安全复用是三个事件。 写入 提交 执行 完成 观察 收取 主机 设备 固定 保持独占所有权 逻辑事件顺序；距离不代表实际耗时</desc><defs><marker id="accelerator-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="190" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">写入</text><path d="M190,55 L190,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="350" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">提交</text><path d="M350,55 L350,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="510" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">执行</text><path d="M510,55 L510,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="670" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">完成</text><path d="M670,55 L670,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="830" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">观察</text><path d="M830,55 L830,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="990" y="38" font-size="22" fill="#eef4ff" text-anchor="middle">收取</text><path d="M990,55 L990,278" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="15" y="113" font-size="24" fill="#8bbcff" text-anchor="start">主机</text><text x="15" y="193" font-size="24" fill="#8de0cf" text-anchor="start">设备</text><text x="15" y="268" font-size="24" fill="#f1c979" text-anchor="start">固定</text><path d="M190,105 L350,105" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><path d="M350,105 L350,185 L670,185 L670,105 L990,105" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-02-arrow)"/><rect x="350" y="240" width="640" height="36" rx="4" fill="#192d3d" stroke="#f1c979" stroke-width="2"/><text x="670.0" y="266" font-size="21" fill="#f1c979" text-anchor="middle">保持独占所有权</text><text x="550" y="325" font-size="22" fill="#b7c7df" text-anchor="middle">逻辑事件顺序；距离不代表实际耗时</text></g></svg>
