<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-spine-title accelerator-00-spine-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-spine-title">一条命令经过虚拟设备</title><desc id="accelerator-00-spine-desc">复制与模 256 加一只操作模型中的字节。 描述符 24 字节 FIFO + 单个执行单元 完成记录 观察 + 收取 源缓冲区 0 254 255 目标缓冲区 1 255 0 加一，模 256 两个缓冲区都固定到安全收取完成</desc><defs><marker id="accelerator-00-spine-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="25" width="230" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="53.5" font-size="23" fill="#8bbcff" text-anchor="middle">描述符</text><text x="145.0" y="82.5" font-size="23" fill="#8bbcff" text-anchor="middle">24 字节</text><rect x="375" y="25" width="300" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="525.0" y="68.0" font-size="23" fill="#8bbcff" text-anchor="middle">FIFO + 单个执行单元</text><path d="M260,60 L375,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-spine-arrow)"/><rect x="800" y="25" width="260" height="70" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="930.0" y="53.5" font-size="23" fill="#8bbcff" text-anchor="middle">完成记录</text><text x="930.0" y="82.5" font-size="23" fill="#8bbcff" text-anchor="middle">观察 + 收取</text><path d="M675,60 L800,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-spine-arrow)"/><text x="110" y="163" font-size="24" fill="#8de0cf" text-anchor="start">源缓冲区</text><rect x="110" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="142.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">0</text><rect x="188" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="220.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">254</text><rect x="266" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="298.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">255</text><text x="715" y="163" font-size="24" fill="#8de0cf" text-anchor="start">目标缓冲区</text><rect x="715" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="747.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">1</text><rect x="793" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="825.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">255</text><rect x="871" y="185" width="65" height="52" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="903.5" y="219.0" font-size="23" fill="#8bbcff" text-anchor="middle">0</text><path d="M365,210 L690,210" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-spine-arrow)"/><text x="525" y="180" font-size="23" fill="#f1c979" text-anchor="middle">加一，模 256</text><rect x="110" y="280" width="840" height="36" rx="4" fill="#192d3d" stroke="#8de0cf" stroke-width="2"/><text x="530.0" y="306" font-size="21" fill="#8de0cf" text-anchor="middle">两个缓冲区都固定到安全收取完成</text></g></svg>
