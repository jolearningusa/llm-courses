<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-03-quiesce-title accelerator-03-quiesce-desc" style="display:block;width:100%;height:auto"><title id="accelerator-03-quiesce-title">确认设备静止后再回收内存</title><desc id="accelerator-03-quiesce-desc">原子静止化与复位是教学模型的假设。 旧命令仍在执行 停止设备访问 回收缓冲区 已确认设备静止 仅改变代次无法停止旧写入</desc><defs><marker id="accelerator-03-quiesce-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="300" height="70" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="175.0" y="73.0" font-size="23" fill="#ff9e9e" text-anchor="middle">旧命令仍在执行</text><rect x="415" y="30" width="270" height="70" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="73.0" font-size="23" fill="#f1c979" text-anchor="middle">停止设备访问</text><path d="M325,65 L415,65" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><rect x="795" y="30" width="280" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="935.0" y="73.0" font-size="23" fill="#8de0cf" text-anchor="middle">回收缓冲区</text><path d="M685,65 L795,65" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><path d="M550,100 L550,185" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><rect x="380" y="185" width="340" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="225.5" font-size="23" fill="#f1c979" text-anchor="middle">已确认设备静止</text><path d="M175,100 L175,280 L930,280 L930,100" fill="none" stroke="#ff9e9e" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M791,271 L809,289" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><path d="M791,289 L809,271" fill="none" stroke="#ff9e9e" stroke-width="2.5"/><text x="500" y="320" font-size="23" fill="#ff9e9e" text-anchor="middle">仅改变代次无法停止旧写入</text></g></svg>
