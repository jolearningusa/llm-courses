<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-00-scope-title accelerator-00-scope-desc" style="display:block;width:100%;height:auto"><title id="accelerator-00-scope-title">四种证据范围</title><desc id="accelerator-00-scope-desc">先确定声明，再选择能够回答它的证据路径。 CPU 模型 描述符 / 状态 / 所有权 文档 API 职责与约束 目标设备 指定版本的设备行为 仪器 指定功耗 / 热测量边界 不能 跨越 证据 范围</desc><defs><marker id="accelerator-00-scope-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="53" font-size="24" fill="#8de0cf" text-anchor="start">CPU 模型</text><path d="M245,45 L340,45" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="53" font-size="24" fill="#eef4ff" text-anchor="start">描述符 / 状态 / 所有权</text><text x="20" y="131" font-size="24" fill="#8de0cf" text-anchor="start">文档</text><path d="M245,123 L340,123" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="131" font-size="24" fill="#eef4ff" text-anchor="start">API 职责与约束</text><text x="20" y="209" font-size="24" fill="#8de0cf" text-anchor="start">目标设备</text><path d="M245,201 L340,201" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="209" font-size="24" fill="#eef4ff" text-anchor="start">指定版本的设备行为</text><text x="20" y="287" font-size="24" fill="#8de0cf" text-anchor="start">仪器</text><path d="M245,279 L340,279" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-00-scope-arrow)"/><text x="375" y="287" font-size="24" fill="#eef4ff" text-anchor="start">指定功耗 / 热测量边界</text><path d="M1030,20 L1030,315" fill="none" stroke="#50617a" stroke-width="2.5"/><text x="1070" y="52" font-size="21" fill="#f1c979" text-anchor="middle">不能</text><text x="1070" y="81" font-size="21" fill="#f1c979" text-anchor="middle">跨越</text><text x="1070" y="110" font-size="21" fill="#f1c979" text-anchor="middle">证据</text><text x="1070" y="139" font-size="21" fill="#f1c979" text-anchor="middle">范围</text></g></svg>
