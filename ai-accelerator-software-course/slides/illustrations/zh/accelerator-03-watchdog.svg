<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-03-watchdog-title accelerator-03-watchdog-desc" style="display:block;width:100%;height:auto"><title id="accelerator-03-watchdog-title">挂起命令继续持有缓冲区</title><desc id="accelerator-03-watchdog-desc">看门狗到期后进入 FAULT；恢复之前继续固定缓冲区。 启动 无进展 看门狗 → FAULT 复位 挂起与 FAULT 期间仍固定缓冲区 超时 / FAULT 不会回收仍可能被访问的内存</desc><defs><marker id="accelerator-03-watchdog-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><path d="M70,110 L1040,110" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-watchdog-arrow)"/><path d="M100,90 L100,130" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="100" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">启动</text><path d="M340,90 L340,130" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="340" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">无进展</text><path d="M610,90 L610,130" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="610" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">看门狗 → FAULT</text><path d="M980,90 L980,130" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="980" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">复位</text><rect x="100" y="180" width="880" height="36" rx="4" fill="#192d3d" stroke="#f1c979" stroke-width="2"/><text x="540.0" y="206" font-size="21" fill="#f1c979" text-anchor="middle">挂起与 FAULT 期间仍固定缓冲区</text><path d="M610,125 L610,165" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-03-watchdog-arrow)"/><path d="M610,225 L610,260" fill="none" stroke="#ff9e9e" stroke-width="2.5" marker-end="url(#accelerator-03-watchdog-arrow)"/><text x="610" y="300" font-size="24" fill="#ff9e9e" text-anchor="middle">超时 / FAULT 不会回收仍可能被访问的内存</text></g></svg>
