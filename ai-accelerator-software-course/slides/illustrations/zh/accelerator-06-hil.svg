<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-06-hil-title accelerator-06-hil-desc" style="display:block;width:100%;height:auto"><title id="accelerator-06-hil-title">一块板卡、执行器与恢复路径</title><desc id="accelerator-06-hil-desc">参考 Twister 匹配测试夹具；加速器部署仍取决于厂商。 测试控制器 板卡与夹具映射 已预约的测试板 执行器 串口 / 结果 日志与决策 部署 / 恢复 匹配测试夹具、板卡身份与受支持的恢复流程。</desc><defs><marker id="accelerator-06-hil-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="20" y="20" width="280" height="65" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="160.0" y="60.5" font-size="23" fill="#8bbcff" text-anchor="middle">测试控制器</text><rect x="415" y="20" width="270" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="60.5" font-size="23" fill="#f1c979" text-anchor="middle">板卡与夹具映射</text><path d="M300,52 L415,52" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-hil-arrow)"/><rect x="800" y="130" width="280" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="940.0" y="180.5" font-size="23" fill="#8de0cf" text-anchor="middle">已预约的测试板</text><path d="M685,52 L940,52 L940,130" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-06-hil-arrow)"/><text x="760" y="35" font-size="21" fill="#eef4ff" text-anchor="start">执行器</text><path d="M800,170 L540,170 L540,255 L300,255" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#accelerator-06-hil-arrow)"/><text x="575" y="155" font-size="22" fill="#8de0cf" text-anchor="middle">串口 / 结果</text><rect x="20" y="220" width="280" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="160.0" y="263.0" font-size="23" fill="#8de0cf" text-anchor="middle">日志与决策</text><path