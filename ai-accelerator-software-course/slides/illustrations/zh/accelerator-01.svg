<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-01-title accelerator-01-desc" style="display:block;width:100%;height:auto"><title id="accelerator-01-title">张量语义与命令契约</title><desc id="accelerator-01-desc">每一层都要保留对应的语义与约束。 张量操作 复制 / 加一 Runtime 资源 缓冲区 + 依赖 设备命令 操作码 + 句柄 语义 生命周期 编码 意图相同，各层契约不同</desc><defs><marker id="accelerator-01-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="50" width="260" height="90" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="155.0" y="88.5" font-size="23" fill="#8bbcff" text-anchor="middle">张量操作</text><text x="155.0" y="117.5" font-size="23" fill="#8bbcff" text-anchor="middle">复制 / 加一</text><rect x="420" y="50" width="260" height="90" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="88.5" font-size="23" fill="#8bbcff" text-anchor="middle">Runtime 资源</text><text x="550.0" y="117.5" font-size="23" fill="#8bbcff" text-anchor="middle">缓冲区 + 依赖</text><rect x="815" y="50" width="260" height="90" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="945.0" y="88.5" font-size="23" fill="#8bbcff" text-anchor="middle">设备命令</text><text x="945.0" y="117.5" font-size="23" fill="#8bbcff" text-anchor="middle">操作码 + 句柄</text><path d="M285,95 L420,95" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-arrow)"/><path d="M680,95 L815,95" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-01-arrow)"/><text x="155" y="205" font-size="26" fill="#8de0cf" text-anchor="middle">语义</text><text x="550" y="205" font-size="26" fill="#8de0cf" text-anchor="middle">生命周期</text><text x="945" y="205" font-size="26" fill="#8de0cf" text-anchor="middle">编码</text><path d="M25,245 L1075,245" fill="none" stroke="#50617a" stroke-width="2.5"/><text x="550" y="297" font-size="25" fill="#f1c979" text-anchor="middle">意图相同，各层契约不同</text></g></svg>
