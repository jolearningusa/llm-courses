<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-04-title accelerator-04-desc" style="display:block;width:100%;height:auto"><title id="accelerator-04-title">Runtime、驱动接口与设备</title><desc id="accelerator-04-desc">Python 模型合并了这些职责；真实驱动需实现对应契约。 Runtime 驱动接口 固件 / 设备 提交与资源 执行命令 完成与状态 观察与安全收取</desc><defs><marker id="accelerator-04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="140" y="30" font-size="24" fill="#8de0cf" text-anchor="middle">Runtime</text><path d="M140,55 L140,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="540" y="30" font-size="24" fill="#8de0cf" text-anchor="middle">驱动接口</text><path d="M540,55 L540,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="965" y="30" font-size="24" fill="#8de0cf" text-anchor="middle">固件 / 设备</text><path d="M965,55 L965,320" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M140,90 L540,90" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-arrow)"/><text x="340.0" y="77" font-size="22" fill="#eef4ff" text-anchor="middle">提交与资源</text><path d="M540,150 L965,150" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-arrow)"/><text x="752.5" y="137" font-size="22" fill="#eef4ff" text-anchor="middle">执行命令</text><path d="M965,220 L540,220" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-arrow)"/><text x="752.5" y="207" font-size="22" fill="#eef4ff" text-anchor="middle">完成与状态</text><path d="M540,285 L140,285" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-04-arrow)"/><text x="340.0" y="272" font-size="22" fill="#eef4ff" text-anchor="middle">观察与安全收取</text></