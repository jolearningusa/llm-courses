<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="accelerator-03-quiesce-title accelerator-03-quiesce-desc" style="display:block;width:100%;height:auto"><title id="accelerator-03-quiesce-title">Quiescence before memory reclamation</title><desc id="accelerator-03-quiesce-desc">Atomic quiesce/reset is a teaching-model assumption. Old command active Stop device access Reclaim buffers Quiescence established Generation tagging alone cannot stop old writes</desc><defs><marker id="accelerator-03-quiesce-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="300" height="70" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="175.0" y="73.0" font-size="23" fill="#ff9e9e" text-anchor="middle">Old command active</text><rect x="415" y="30" width="270" height="70" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="73.0" font-size="23" fill="#f1c979" text-anchor="middle">Stop device access</text><path d="M325,65 L415,65" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><rect x="795" y="30" width="280" height="70" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="935.0" y="73.0" font-size="23" fill="#8de0cf" text-anchor="middle">Reclaim buffers</text><path d="M685,65 L795,65" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><path d="M550,100 L550,185" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#accelerator-03-quiesce-arrow)"/><rect x="380" y="185" width="340" height="65" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="225.5" font-size="23" fill="#f1c979" text-anchor="middle">Quiescence established</text><path d="M175,100 L1