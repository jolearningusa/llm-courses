<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="expert-skew-title expert-skew-desc" style="display:block;width:100%;height:auto"><title id="expert-skew-title">The hottest expert can determine the tail</title><desc id="expert-skew-desc">Uniform expert loads of 9,9,8,8 are compared with skewed loads of 17,17,0,0 using a common scale.</desc><defs><marker id="expert-skew-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="35" font-size="25" fill="#eef4ff" text-anchor="start">Balanced</text><rect x="70" y="160" width="65" height="90" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="102" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E0</text><text x="102" y="150" font-size="22" fill="#eef4ff" text-anchor="middle">9</text><rect x="182" y="160" width="65" height="90" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="214" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E1</text><text x="214" y="150" font-size="22" fill="#eef4ff" text-anchor="middle">9</text><rect x="294" y="170" width="65" height="80" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="326" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E2</text><text x="326" y="160" font-size="22" fill="#eef4ff" text-anchor="middle">8</text><rect x="406" y="170" width="65" height="80" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="438" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E3</text><text x="438" y="160" font-size="22" fill="#eef4ff" text-anchor="middle">8</text><path d="M40,250 L520,250" fill="none" stroke="#b7c7df" stroke-width="2.5"/><text x="580" y="35" font-size="25" fill="#eef4ff" text-anchor="start">Skewed</text><rect x="620" y="80" width="65" height="170" rx="5" fill="#5f4b2a" stroke="#f1c979" stroke-width="2"/><text x="652" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E0</text><text x="652" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">17</text><rect x="732" y="80" width="65" height="170" rx="5" fill="#5f4b2a" stroke="#f1c979" stroke-width="2"/><text x="764" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E1</text><text x="764" y="70" font-size="22" fill="#eef4ff" text-anchor="middle">17</text><text x="876" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E2</text><text x="876" y="240" font-size="22" fill="#eef4ff" text-anchor="middle">0</text><text x="988" y="275" font-size="22" fill="#b7c7df" text-anchor="middle">E3</text><text x="988" y="240" font-size="22" fill="#eef4ff" text-anchor="middle">0</text><path d="M590,250 L1070,250" fill="none" stroke="#b7c7df" stroke-width="2.5"/><text x="355" y="325" font-size="23" fill="#b7c7df" text-anchor="start">34 token–expert assignments in each case</text></g></svg>