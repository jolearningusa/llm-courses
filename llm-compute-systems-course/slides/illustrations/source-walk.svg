<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="source-walk-title source-walk-desc" style="display:block;width:100%;height:auto"><title id="source-walk-title">Trace the decision through code boundaries</title><desc id="source-walk-desc">Configuration feeds rank-mesh construction, model transformations, compilation and the training step. Checkpoint state connects model, optimizer and data.</desc><defs><marker id="source-walk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="65" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="122.8" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Config</text><path d="M218.6,97 L239.6,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#source-walk-arrow)"/><rect x="243.6" y="65" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="336.4" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Rank mesh</text><path d="M432.2,97 L453.2,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#source-walk-arrow)"/><rect x="457.2" y="65" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Transform model</text><path d="M645.8,97 L666.8,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#source-walk-arrow)"/><rect x="670.8" y="65" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="763.5999999999999" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Compile</text><path d="M859.4,97 L880.4,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#source-walk-arrow)"/><rect x="884.4" y="65" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="977.1999999999999" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Train step</text><rect x="230" y="235" width="640" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="272.0" font-size="22" fill="#f1c979" text-anchor="middle">Checkpoint: model + optimizer + RNG + data</text><path d="M550,129 L550,235" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#source-walk-arrow)"/><text x="260" y="195" font-size="23" fill="#b7c7df" text-anchor="start">source path ≠ measured kernel dispatch</text></g></svg>