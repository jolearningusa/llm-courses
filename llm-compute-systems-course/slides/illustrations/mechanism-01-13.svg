<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-01-13-title mechanism-01-13-desc" style="display:block;width:100%;height:auto"><title id="mechanism-01-13-title">Capacity is a separate constraint</title><desc id="mechanism-01-13-desc">Equal boxes name ledger terms; their widths do not encode bytes. Weights + Live KV + Activations + Workspace All live allocations must fit the capacity budget </desc><defs><marker id="mechanism-01-13-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">Weights</text><text x="280" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="295" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="415.0" y="100.5" font-size="23" fill="#8de0cf" text-anchor="middle">Live KV</text><text x="550" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="565" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">Activations</text><text x="820" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="835" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="955.0" y="100.5" font-size="23" fill="#8de0cf" text-anchor="middle">Workspace</text><text x="550" y="215" font-size="26" fill="#f1c979" text-anchor="middle">All live allocations must fit the capacity budget</text><text x="550" y="300" font-size="25" fill="#eef4ff" text-anchor="middle"></text></g></svg>
