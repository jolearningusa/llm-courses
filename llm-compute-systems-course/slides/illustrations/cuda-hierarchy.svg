<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="cuda-hierarchy-title cuda-hierarchy-desc" style="display:block;width:100%;height:auto"><title id="cuda-hierarchy-title">Grid, blocks and storage scopes</title><desc id="cuda-hierarchy-desc">A grid contains blocks, each with warps and per-block shared memory; global HBM is accessible across blocks.</desc><defs><marker id="cuda-hierarchy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="30" width="500" height="220" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="50" y="62" font-size="24" fill="#8bbcff" text-anchor="start">Block 0</text><rect x="50" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="102.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 0</text><rect x="167" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="219.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 1</text><rect x="284" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="336.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 2</text><rect x="401" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="453.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 3</text><rect x="50" y="170" width="460" height="55" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="280.0" y="204.5" font-size="22" fill="#f1c979" text-anchor="middle">shared memory: this block only</text><rect x="560" y="30" width="500" height="220" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="580" y="62" font-size="24" fill="#8bbcff" text-anchor="start">Block 1</text><rect x="580" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="632.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 0</text><rect x="697" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="749.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 1</text><rect x="814" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="866.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 2</text><rect x="931" y="85" width="105" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="983.5" y="119.5" font-size="22" fill="#8de0cf" text-anchor="middle">warp 3</text><rect x="580" y="170" width="460" height="55" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="810.0" y="204.5" font-size="22" fill="#f1c979" text-anchor="middle">shared memory: this block only</text><rect x="300" y="280" width="500" height="48" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="311.0" font-size="22" fill="#8bbcff" text-anchor="middle">Global memory / HBM</text><path d="M280,250 L420,280" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#cuda-hierarchy-arrow)"/><path d="M810,250 L680,280" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#cuda-hierarchy-arrow)"/></g></svg>