<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="autograd-graph-title autograd-graph-desc" style="display:block;width:100%;height:auto"><title id="autograd-graph-title">Saved values connect forward and backward</title><desc id="autograd-graph-desc">Forward x and W produce y and loss; backward uses saved x and W to compute input and weight gradients.</desc><defs><marker id="autograd-graph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="50" width="170" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="115.0" y="87.0" font-size="22" fill="#8bbcff" text-anchor="middle">x, W</text><rect x="350" y="50" width="170" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="435.0" y="87.0" font-size="22" fill="#8de0cf" text-anchor="middle">y = xW</text><rect x="700" y="50" width="170" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="785.0" y="87.0" font-size="22" fill="#8de0cf" text-anchor="middle">loss</text><path d="M200,80 L350,80" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#autograd-graph-arrow)"/><path d="M520,80 L700,80" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#autograd-graph-arrow)"/><rect x="350" y="220" width="300" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="500.0" y="247.0" font-size="22" fill="#8bbcff" text-anchor="middle">dX = dY Wᵀ </text><text x="500.0" y="272.0" font-size="22" fill="#8bbcff" text-anchor="middle"> dW = Xᵀ dY</text><rect x="750" y="220" width="160" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="830.0" y="259.5" font-size="22" fill="#f1c979" text-anchor="middle">dY</text><path d="M785,110 L785,220" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#autograd-graph-arrow)"/><path d="M750,252 L650,252" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#autograd-graph-arrow)"/><path d="M110,110 L110,252 L350,252" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#autograd-graph-arrow)"/><text x="45" y="180" font-size="21" fill="#8bbcff" text-anchor="start">saved state</text></g></svg>