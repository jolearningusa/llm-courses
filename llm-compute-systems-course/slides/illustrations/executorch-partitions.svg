<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="executorch-partitions-title executorch-partitions-desc" style="display:block;width:100%;height:auto"><title id="executorch-partitions-title">Delegation does not remove boundary costs</title><desc id="executorch-partitions-desc">An exported graph contains two supported regions with an unsupported region between; delegate and fallback transitions may require conversion or transfer.</desc><defs><marker id="executorch-partitions-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="45" width="328.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="194.0" y="84.0" font-size="22" fill="#8de0cf" text-anchor="middle">Supported region</text><path d="M361.0,77 L382.0,77" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#executorch-partitions-arrow)"/><rect x="386.0" y="45" width="328.0" height="64" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="84.0" font-size="22" fill="#f1c979" text-anchor="middle">Fallback region</text><path d="M717.0,77 L738.0,77" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#executorch-partitions-arrow)"/><rect x="742.0" y="45" width="328.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="906.0" y="84.0" font-size="22" fill="#8de0cf" text-anchor="middle">Supported region</text><rect x="60" y="235" width="300" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="210.0" y="272.0" font-size="22" fill="#8de0cf" text-anchor="middle">Target delegate</text><rect x="400" y="235" width="300" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="272.0" font-size="22" fill="#f1c979" tex