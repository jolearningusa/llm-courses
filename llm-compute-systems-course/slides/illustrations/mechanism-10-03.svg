<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-10-03-title mechanism-10-03-desc" style="display:block;width:100%;height:auto"><title id="mechanism-10-03-title">A pipelined tile loop</title><desc id="mechanism-10-03-desc">Read only after ready; reuse a buffer only after its consumer releases it. Producer Consumer Fill A: tile 0 Read A: tile 0 Fill B: tile 1 Read B: tile 1 logical order / schematic</desc><defs><marker id="mechanism-10-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="15" y="67" font-size="22" fill="#8bbcff" text-anchor="start">Producer</text><text x="15" y="187" font-size="22" fill="#8de0cf" text-anchor="start">Consumer</text><rect x="230" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="327.5" y="62.0" font-size="23" fill="#8bbcff" text-anchor="middle">Fill A: tile</text><text x="327.5" y="90.0" font-size="23" fill="#8bbcff" text-anchor="middle">0</text><rect x="435" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="532.5" y="182.0" font-size="23" fill="#8de0cf" text-anchor="middle">Read A: tile</text><text x="532.5" y="210.0" font-size="23" fill="#8de0cf" text-anchor="middle">0</text><rect x="435" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="532.5" y="62.0" font-size="23" fill="#8bbcff" text-anchor="middle">Fill B: tile</text><text x="532.5" y="90.0" font-size="23" fill="#8bbcff" text-anchor="middle">1</text><rect x="640" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="737.5" y="182.0" font-size="23" fill="#8de0cf" text-anchor="middle">Read B: tile</text><text x="737.5" y="210.0" font-size="2