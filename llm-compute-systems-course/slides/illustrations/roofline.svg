<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="roofline-title roofline-desc" style="display:block;width:100%;height:auto"><title id="roofline-title">Compute and bandwidth ceilings</title><desc id="roofline-desc">A bandwidth slope meets a compute ceiling; decode-like low intensity and prefill-like higher intensity workloads occupy different regions.</desc><defs><marker id="roofline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><path d="M100,270 L1040,270" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#roofline-arrow)"/><path d="M100,270 L100,30" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#roofline-arrow)"/><path d="M110,260 L570,75 L1010,75" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="660" y="58" font-size="24" fill="#8de0cf" text-anchor="start">compute ceiling</text><text x="260" y="145" font-size="22" fill="#8de0cf" text-anchor="start">bandwidth ceiling</text><text x="170" y="245" font-size="23" fill="#f1c979" text-anchor="start">decode-like</text><text x="650" y="180" font-size="23" fill="#8bbcff" text-anchor="start">prefill-like</text><text x="530" y="318" font-size="24" fill="#eef4ff" text-anchor="start">Arithmetic intensity →</text><text x="115" y="35" font-size="23" fill="#eef4ff" text-anchor="start">Achievable rate</text><text x="770" y="240" font-size="22" fill="#b7c7df" text-anchor="start">more reuse →</text></g></svg>