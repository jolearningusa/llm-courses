<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-16-02-title mechanism-16-02-desc" style="display:block;width:100%;height:auto"><title id="mechanism-16-02-title">Six cache layers</title><desc id="mechanism-16-02-desc">Each cached object avoids different work and needs its own validity contract. Completed answer Avoid a valid full call Compatible prefix Avoid repeated prefill Live sequence KV Avoid old-state recomputation Offloaded session Avoid post-wait recomputation Compiled code / graph Avoid compile / launch setup Weights / OS pages Avoid some loading traffic</desc><defs><marker id="mechanism-16-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="10" width="450" height="44" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="40.0" font-size="23" fill="#8bbcff" text-anchor="middle">Completed answer</text><path d="M475,32 L590,32" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="40" font-size="23" fill="#eef4ff" text-anchor="start">Avoid a valid full call</text><rect x="25" y="65" width="450" height="44" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="95.0" font-size="23" fill="#8de0cf" text-anchor="middle">Compatible prefix</text><path d="M475,87 L590,87" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="95" font-size="23" fill="#eef4ff" text-anchor="start">Avoid repeated prefill</text><rect x="25" y="120" width="450" height="44" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="150.0" font-size="23" fill="#8bbcff" text-anchor="middle">Live sequence KV</text><path d="M475,142 L590,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="150" font-size="23" fill="#eef4ff" text-anchor="start">Avoid old-state recomputation</text><rect x="25" y="175" width="450" height="44" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="205.0" font-size="23" fill="#8de0cf" text-anchor="middle">Offloaded session</text><path d="M475,197 L590,197" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="205" font-size="23" fill="#eef4ff" text-anchor="start">Avoid post-wait recomputation</text><rect x="25" y="230" width="450" height="44" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="260.0" font-size="23" fill="#8bbcff" text-anchor="middle">Compiled code / graph</text><path d="M475,252 L590,252" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="260" font-size="23" fill="#eef4ff" text-anchor="start">Avoid compile / launch setup</text><rect x="25" y="285" width="450" height="44" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="315.0" font-size="23" fill="#8de0cf" text-anchor="middle">Weights / OS pages</text><path d="M475,307 L590,307" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="315" font-size="23" fill="#eef4ff" text-anchor="start">Avoid some loading traffic</text></g></svg>
