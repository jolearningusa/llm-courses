<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="timing-boundaries-title timing-boundaries-desc" style="display:block;width:100%;height:auto"><title id="timing-boundaries-title">Submission is not completion</title><desc id="timing-boundaries-desc">Host launch bars end before device compute bars; an end synchronization aligns wall timing with completed work.</desc><defs><marker id="timing-boundaries-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="85" font-size="24" fill="#eef4ff" text-anchor="start">Host</text><text x="30" y="190" font-size="24" fill="#eef4ff" text-anchor="start">Device</text><rect x="190" y="50" width="85" height="50" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="232.5" y="82.0" font-size="22" fill="#8bbcff" text-anchor="middle">launch</text><rect x="300" y="50" width="85" height="50" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="342.5" y="82.0" font-size="22" fill="#8bbcff" text-anchor="middle">launch</text><rect x="410" y="50" width="85" height="50" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="452.5" y="82.0" font-size="22" fill="#8bbcff" text-anchor="middle">launch</text><rect x="230" y="155" width="190" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="325.0" y="194.5" font-size="22" fill="#8de0cf" text-anchor="middle">kernel 0</text><rect x="440" y="155" width="190" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="535.0" y="194.5" font-size="22" fill="#8de0cf" text-anchor="middle">kernel 1</text><rect x="650" y="155" width="190" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="745.0" y="194.5" font-size="22" fill="#8de0cf" text-anchor="middle">kernel 2</text><path d="M180,285 L1010,285" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#timing-boundaries-arrow)"/><text x="220" y="320" font-size="22" fill="#eef4ff" text-anchor="start">time →</text><path d="M520,35 L520,245" fill="none" stroke="#f1c979" stroke-width="2.5" stroke-dasharray="6 5"/><text x="450" y="265" font-size="20" fill="#f1c979" text-anchor="start">host stops</text><path d="M880,35 L880,245" fill="none" stroke="#f1c979" stroke-width="2.5" stroke-dasharray="6 5"/><text x="860" y="265" font-size="20" fill="#f1c979" text-anchor="start">device done</text></g></svg>