<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="shared-blocks-title shared-blocks-desc" style="display:block;width:100%;height:auto"><title id="shared-blocks-title">One cancellation must preserve the other owner</title><desc id="shared-blocks-desc">Two requests point to the same two prefix blocks and distinct suffix blocks; the shared blocks have reference count two.</desc><defs><marker id="shared-blocks-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="50" width="180" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="120.0" y="87.0" font-size="22" fill="#8bbcff" text-anchor="middle">Request A</text><rect x="30" y="230" width="180" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="120.0" y="267.0" font-size="22" fill="#8de0cf" text-anchor="middle">Request B</text><rect x="370" y="130" width="155" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="447.5" y="169.5" font-size="22" fill="#f1c979" text-anchor="middle">Prefix 0</text><rect x="545" y="130" width="155" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="622.5" y="169.5" font-size="22" fill="#f1c979" text-anchor="middle">Prefix 1</text><rect x="720" y="130" width="155" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="797.5" y="169.5" font-size="22" fill="#8bbcff" text-anchor="middle">Suffix A</text><rect x="895" y="130" width="155" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="972.5" y="169.5" font-size="22" fill="#8de0cf" text-anchor="middle">Suffix B</text><path d="M210,80 L300,80 L300,155 L370,155" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#shared-blocks-arrow)"/><path d="M210,260 L320,260 L320,175 L370,175" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#shared-blocks-arrow)"/><path d="M525,162 L545,162" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#shared-blocks-arrow)"/><path d="M620,130 L620,90 L795,90 L795,130" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#shared-blocks-arrow)"/><path d="M620,195 L620,250 L970,250 L970,195" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#shared-blocks-arrow)"/><text x="385" y="305" font-size="23" fill="#f1c979" text-anchor="start">Prefix references: 2 → 1 when one request cancels</text></g></svg>