<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="decode-dependency-title decode-dependency-desc" style="display:block;width:100%;height:auto"><title id="decode-dependency-title">Dependent steps, independent sequences</title><desc id="decode-dependency-desc">The top row connects a forward step, next-token selection and the next forward step. Three independent sequence rows below can supply parallel work to a batch.</desc><defs><marker id="decode-dependency-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="30" font-size="22" fill="#f1c979" text-anchor="start">One sequence: dependent steps</text><rect x="30" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="180.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">Forward with x_t</text><rect x="400" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">Select x_(t+1)</text><rect x="770" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="920.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">Forward with x_(t+1)</text><path d="M335,84 L395,84" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#decode-dependency-arrow)"/><path d="M705,84 L765,84" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#decode-dependency-arrow)"/><text x="30" y="180" font-size="22" fill="#8de0cf" text-anchor="start">Other ready sequences: independent rows</text><rect x="30" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="180.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">Sequence A: token t+1</text><rect x="400" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">Sequence B: token u+1</text><rect x="770" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="920.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">Sequence C: token v+1</text><text x="550" y="322" font-size="22" fill="#b7c7df" text-anchor="middle">Batching supplies parallel work; it preserves each dependency</text></g></svg>