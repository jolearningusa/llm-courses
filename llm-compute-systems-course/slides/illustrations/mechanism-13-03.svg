<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-13-03-title mechanism-13-03-desc" style="display:block;width:100%;height:auto"><title id="mechanism-13-03-title">Range and resolution</title><desc id="mechanism-13-03-desc">Symbolic number line; ticks do not reproduce any specific floating-point encoding. −range −small 0 +small +range Range and spacing are separate format choices </desc><defs><marker id="mechanism-13-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><path d="M50,170 L1050,170" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-13-03-arrow)"/><path d="M90,155 L90,185" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="90" y="130" font-size="23" fill="#eef4ff" text-anchor="middle">−range</text><path d="M315,155 L315,185" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="315" y="130" font-size="23" fill="#eef4ff" text-anchor="middle">−small</text><path d="M540,155 L540,185" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="540" y="130" font-size="23" fill="#eef4ff" text-anchor="middle">0</text><path d="M765,155 L765,185" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="765" y="130" font-size="23" fill="#eef4ff" text-anchor="middle">+small</text><path d="M990,155 L990,185" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="990" y="130" font-size="23" fill="#eef4ff" text-anchor="middle">+range</text><text x="550" y="265" font-size="25" fill="#f1c979" text-anchor="middle">Range and spacing are separate format choices</text><text x="550" y="325" font-size="23" fill="#b7c7df" text-anchor="middle"></text></g></svg>
