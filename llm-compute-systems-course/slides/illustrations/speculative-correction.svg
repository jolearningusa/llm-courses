<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="speculative-correction-title speculative-correction-desc" style="display:block;width:100%;height:auto"><title id="speculative-correction-title">Verify the draft before keeping its state</title><desc id="speculative-correction-desc">Draft tokens are verified by the target; an accepted prefix is retained and the first rejected position is sampled from a corrected distribution.</desc><defs><marker id="speculative-correction-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Draft q</text><path d="M272.0,97 L293.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#speculative-correction-arrow)"/><rect x="297.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Target scores p</text><path d="M539.0,97 L560.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#speculative-correction-arrow)"/><rect x="564.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Accept prefix</text><path d="M806.0,97 L827.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#speculative-correction-arrow)"/><rect x="831.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Correct / bonus</text><rect x="170" y="235" width="175" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="257.5" y="272.0" font-size="22" fill="#8de0cf" text-anchor="middle">keep</text><rect x="375" y="235" width="175" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="462.5" y="272.0" font-size="22" fill="#8de0cf" text-anchor="middle">keep</text><rect x="580" y="235" width="175" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="667.5" y="272.0" font-size="22" fill="#f1c979" text-anchor="middle">reject</text><rect x="785" y="235" width="175" height="60" rx="5" fill="#101927" stroke="#50617a" stroke-width="2"/><text x="872.5" y="272.0" font-size="22" fill="#50617a" text-anchor="middle">discard</text><text x="200" y="195" font-size="24" fill="#f1c979" text-anchor="start">Accepted history ends at the first rejection</text></g></svg>