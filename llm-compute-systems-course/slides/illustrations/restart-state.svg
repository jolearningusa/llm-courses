<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="restart-state-title restart-state-desc" style="display:block;width:100%;height:auto"><title id="restart-state-title">Recover the same training trajectory</title><desc id="restart-state-desc">An uninterrupted six-step run is compared with a run saved after three steps and resumed after restoring model, optimizer, RNG and data cursor.</desc><defs><marker id="restart-state-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="23" fill="#eef4ff" text-anchor="start">Uninterrupted</text><rect x="210" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="270.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 1</text><rect x="350" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="410.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 2</text><rect x="490" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 3</text><rect x="630" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="690.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 4</text><rect x="770" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="830.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 5</text><rect x="910" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="970.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 6</text><text x="30" y="145" font-size="23" fill="#eef4ff" text-anchor="start">Interrupted</text><rect x="210" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="270.0" y="149.5" font-size="22" fill="#8bbcff" text-anchor="middle">step 1</text><rect x="350" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="410.0" y="149.5" font-size="22" fill="#8bbcff" text-anchor="middle">step 2</text><rect x="490" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="149.5" font-size="22" fill="#8bbcff" text-anchor="middle">step 3</text><rect x="210" y="245" width="500" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="460.0" y="284.5" font-size="22" fill="#f1c979" text-anchor="middle">Restore model / optimizer / RNG / cursor</text><path d="M570,170 L570,210 L460,210 L460,245" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#restart-state-arrow)"/><path d="M710,277 L740,277 L740,205 L690,205 L690,170" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#restart-state-arrow)"/><rect x="630" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="690.0" y="149.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 4</text><rect x="770" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="830.0" y="149.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 5</text><rect x="910" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="970.0" y="149.5" font-size="22" fill="#8de0cf" text-anchor="middle">step 6</text></g></svg>