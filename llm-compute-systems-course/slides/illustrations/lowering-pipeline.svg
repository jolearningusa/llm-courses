<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="lowering-pipeline-title lowering-pipeline-desc" style="display:block;width:100%;height:auto"><title id="lowering-pipeline-title">Partition, then library or generated kernels</title><desc id="lowering-pipeline-desc">A framework graph becomes a graph IR, is partitioned and fused, then anchor operators go to library or vendor kernels and the rest to generated kernels; both feed a runtime artifact such as an IREE module or TVM library.</desc><defs><marker id="lowering-pipeline-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="40" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="194.0" y="79.0" font-size="22" fill="#8bbcff" text-anchor="middle">Framework graph</text><path d="M361.0,72 L382.0,72" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/><rect x="386.0" y="40" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="79.0" font-size="22" fill="#8bbcff" text-anchor="middle">Graph IR</text><path d="M717.0,72 L738.0,72" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/><rect x="742.0" y="40" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="906.0" y="79.0" font-size="22" fill="#8bbcff" text-anchor="middle">Partition + fuse</text><rect x="150" y="170" width="360" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="330.0" y="209.0" font-size="22" fill="#8bbcff" text-anchor="middle">Anchor ops: library / BYOC</text><rect x="590" y="170" width="360" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="770.0" y="209.0" font-size="22" fill="#8de0cf" text-anchor="middle">Long tail: generated kernels</text><path d="M950,104 L330,170" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/><path d="M960,104 L770,170" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/><rect x="240" y="272" width="620" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="308.0" font-size="22" fill="#f1c979" text-anchor="middle">Runtime artifact: host schedule + device binaries</text><path d="M330,234 L500,272" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/><path d="M770,234 L600,272" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#lowering-pipeline-arrow)"/></g></svg>