<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="quantized-bytes-title quantized-bytes-desc" style="display:block;width:100%;height:auto"><title id="quantized-bytes-title">Packing saves bytes; scales consume some</title><desc id="quantized-bytes-desc">A BF16 array of 2048 bytes becomes 512 bytes of packed int4 values plus 128 bytes of group scales, a 3.2-fold raw-array reduction.</desc><defs><marker id="quantized-bytes-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="45" font-size="24" fill="#8bbcff" text-anchor="start">BF16 baseline: 2,048 B</text><rect x="30" y="70" width="1024" height="65" rx="5" fill="#24456a" stroke="#8bbcff" stroke-width="2"/><text x="30" y="190" font-size="24" fill="#8de0cf" text-anchor="start">Packed int4</text><rect x="30" y="215" width="512" height="65" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="286" y="255" font-size="25" fill="#8de0cf" text-anchor="middle">512 B</text><rect x="560" y="215" width="128" height="65" rx="5" fill="#5f4b2a" stroke="#f1c979" stroke-width="2"/><text x="720" y="252" font-size="24" fill="#f1c979" text-anchor="start">128 B FP32 scales</text><text x="650" y="115" font-size="24" fill="#eef4ff" text-anchor="start">3.2× raw-array reduction</text></g></svg>