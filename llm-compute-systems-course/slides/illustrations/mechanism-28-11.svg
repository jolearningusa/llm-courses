<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-28-11-title mechanism-28-11-desc" style="display:block;width:100%;height:auto"><title id="mechanism-28-11-title">Expert groups are separate</title><desc id="mechanism-28-11-desc">Conceptual responsibilities; record the real group constructor and membership. Expert-routed tensors Expert placement group Token dispatch group Expert execution Do not infer expert groups from tensor-parallel names alone</desc><defs><marker id="mechanism-28-11-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="125" width="230" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="159.0" font-size="23" fill="#8bbcff" text-anchor="middle">Expert-routed</text><text x="140.0" y="187.0" font-size="23" fill="#8bbcff" text-anchor="middle">tensors</text><rect x="410" y="20" width="295" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="557.5" y="54.0" font-size="23" fill="#8de0cf" text-anchor="middle">Expert placement</text><text x="557.5" y="82.0" font-size="23" fill="#8de0cf" text-anchor="middle">group</text><rect x="410" y="235" width="295" height="80" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="557.5" y="283.0" font-size="23" fill="#f1c979" text-anchor="middle">Token dispatch group</text><rect x="855" y="125" width="220" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="965.0" y="159.0" font-size="23" fill="#8bbcff" text-anchor="middle">Expert</text><text x="965.0" y="187.0" font-size="23" fill="#8bbcff" text-anchor="middle">execution</text><path d="M255,165 L330,165 L330,60 L410,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-28-11-arrow)"/><path d="M330,165 L330,275 L410,275" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-28-11-arrow)"/><path d="M705,60 L785,60 L785,165 L855,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-28-11-arrow)"/><path d="M705,275 L785,275 L785,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-28-11-arrow)"/><text x="550" y="146" font-size="23" fill="#b7c7df" text-anchor="middle">Do not infer expert groups from</text><text x="550" y="174" font-size="23" fill="#b7c7df" text-anchor="middle">tensor-parallel names alone</text></g></svg>
