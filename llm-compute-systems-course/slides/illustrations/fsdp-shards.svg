<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="fsdp-shards-title fsdp-shards-desc" style="display:block;width:100%;height:auto"><title id="fsdp-shards-title">Shards become transient full parameters</title><desc id="fsdp-shards-desc">Four ranks hold different parameter shards. All-gather materializes a layer for compute; reduce-scatter partitions reduced gradients afterward.</desc><defs><marker id="fsdp-shards-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="25" width="235" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="147.5" y="62.0" font-size="22" fill="#8bbcff" text-anchor="middle">Rank 0: shard 0</text><rect x="295" y="25" width="235" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="412.5" y="62.0" font-size="22" fill="#8bbcff" text-anchor="middle">Rank 1: shard 1</text><rect x="560" y="25" width="235" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="677.5" y="62.0" font-size="22" fill="#8bbcff" text-anchor="middle">Rank 2: shard 2</text><rect x="825" y="25" width="235" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="942.5" y="62.0" font-size="22" fill="#8bbcff" text-anchor="middle">Rank 3: shard 3</text><rect x="260" y="145" width="580" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="184.5" font-size="22" fill="#8de0cf" text-anchor="middle">all-gather → full layer → compute</text><path d="M147,85 L330,145" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#fsdp-shards-arrow)"/><path d="M412,85 L480,145" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#fsdp-shards-arrow)"/><path d="M677,85 L630,145" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#fsdp-shards-arrow)"/><path d="M942,85 L780,145" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#fsdp-shards-arrow)"/><rect x="270" y="270" width="560" height="55" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="304.5" font-size="22" fill="#f1c979" text-anchor="middle">reduce-scatter → gradient shards</text><path d="M550,210 L550,270" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#fsdp-shards-arrow)"/></g></svg>