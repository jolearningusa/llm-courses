<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-08-10-title mechanism-08-10-desc" style="display:block;width:100%;height:auto"><title id="mechanism-08-10-title">Fusion tradeoffs</title><desc id="mechanism-08-10-desc">Avoided intermediate traffic can trade against registers, occupancy and specialization. Separate Kernel A HBM intermediate Kernel B Fused Load inputs A + B in one kernel Store final output</desc><defs><marker id="mechanism-08-10-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="75" font-size="22" fill="#8bbcff" text-anchor="start">Separate</text><rect x="260" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="387.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">Kernel A</text><path d="M515,75 L540,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-08-10-arrow)"/><rect x="540" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="667.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">HBM intermediate</text><path d="M795,75 L820,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-08-10-arrow)"/><rect x="820" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="947.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">Kernel B</text><text x="20" y="240" font-size="22" fill="#8de0cf" text-anchor="start">Fused</text><rect x="260" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="387.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">Load inputs</text><path d="M515,240 L540,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-08-10-arrow)"/><rect x="540" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="667.5" y="234.0" font-size="23" fill="#8de0cf" text-anchor="middle">A + B in one</text><text x="667.5" y="262.0" font-size="23" fill="#8de0cf" text-anchor="middle">kernel</text><path d="M795,240 L820,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-08-10-arrow)"/><rect x="820" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="947.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">Store final output</text></g></svg>
