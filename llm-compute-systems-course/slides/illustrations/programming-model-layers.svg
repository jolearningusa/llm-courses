<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="programming-model-layers-title programming-model-layers-desc" style="display:block;width:100%;height:auto"><title id="programming-model-layers-title">Graph compilers, kernel DSLs and vendor targets</title><desc id="programming-model-layers-desc">TorchInductor generates Triton; XLA reaches Triton and TileLang kernels through custom calls and Pallas through JAX; Triton targets NVIDIA and AMD, TileLang targets NVIDIA, AMD and Apple Metal, Pallas targets TPU and NVIDIA, cuTile targets NVIDIA.</desc><defs><marker id="programming-model-layers-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="180" y="20" width="330" height="58" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="345.0" y="56.0" font-size="22" fill="#8de0cf" text-anchor="middle">TorchInductor</text><rect x="600" y="20" width="330" height="58" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="765.0" y="56.0" font-size="22" fill="#8de0cf" text-anchor="middle">XLA (StableHLO in)</text><rect x="30" y="140" width="230" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="176.0" font-size="22" fill="#8bbcff" text-anchor="middle">Triton</text><rect x="300" y="140" width="230" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="415.0" y="176.0" font-size="22" fill="#8bbcff" text-anchor="middle">TileLang</text><rect x="570" y="140" width="230" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="176.0" font-size="22" fill="#8bbcff" text-anchor="middle">Pallas</text><rect x="840" y="140" width="230" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="955.0" y="176.0" font-size="22" fill="#8bbcff" text-anchor="middle">cuTile</text><rect x="30" y="262" width="230" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="145.0" y="298.0" font-size="22" fill="#f1c979" text-anchor="middle">NVIDIA (PTX)</text><rect x="300" y="262" width="230" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="415.0" y="298.0" font-size="22" fill="#f1c979" text-anchor="middle">AMD (AMDGCN)</text><rect x="570" y="262" width="230" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="685.0" y="298.0" font-size="22" fill="#f1c979" text-anchor="middle">Apple Metal</text><rect x="840" y="262" width="230" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="955.0" y="298.0" font-size="22" fill="#f1c979" text-anchor="middle">TPU (Mosaic)</text><path d="M260,78 L150,140" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M700,78 L180,140" fill="none" stroke="#b7c7df" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#programming-model-layers-arrow)"/><path d="M740,78 L420,140" fill="none" stroke="#b7c7df" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#programming-model-layers-arrow)"/><path d="M800,78 L685,140" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M70,198 L70,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M120,198 L340,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M340,198 L120,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M390,198 L390,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M440,198 L660,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M760,198 L980,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M610,198 L170,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/><path d="M880,198 L220,262" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#programming-model-layers-arrow)"/></g></svg>