<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="pd-placement-title pd-placement-desc" style="display:block;width:100%;height:auto"><title id="pd-placement-title">Compare the same total resources</title><desc id="pd-placement-desc">A two-device colocated baseline is compared with a two-device split prefill/decode design joined by a KV transfer path.</desc><defs><marker id="pd-placement-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#8bbcff" text-anchor="start">Colocated baseline: 2 devices</text><rect x="80" y="70" width="340" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="109.5" font-size="22" fill="#8bbcff" text-anchor="middle">GPU 0: prefill + decode</text><rect x="660" y="70" width="340" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="830.0" y="109.5" font-size="22" fill="#8bbcff" text-anchor="middle">GPU 1: prefill + decode</text><text x="30" y="205" font-size="24" fill="#8de0cf" text-anchor="start">Split alternative: 2 devices</text><rect x="80" y="240" width="340" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="279.5" font-size="22" fill="#8de0cf" text-anchor="middle">GPU 0: prefill</text><rect x="660" y="240" width="340" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="830.0" y="279.5" font-size="22" fill="#8de0cf" text-anchor="middle">GPU 1: decode</text><path d="M420,272 L660,272" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#pd-placement-arrow)"/><text x="465" y="252" font-size="21" fill="#f1c979" text-anchor="start">KV transfer</text></g></svg>