<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="online-attention-title online-attention-desc" style="display:block;width:100%;height:auto"><title id="online-attention-title">Stream K/V and retain online row state</title><desc id="online-attention-desc">A query tile consumes multiple key/value tiles while updating m, l and u, then emits a normalized output without materializing all scores.</desc><defs><marker id="online-attention-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="110" width="160" height="70" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="110.0" y="152.0" font-size="22" fill="#8bbcff" text-anchor="middle">Query tile</text><rect x="300" y="30" width="185" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="392.5" y="64.5" font-size="22" fill="#8bbcff" text-anchor="middle">K/V tile 0</text><rect x="530" y="30" width="185" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="622.5" y="64.5" font-size="22" fill="#8bbcff" text-anchor="middle">K/V tile 1</text><rect x="760" y="30" width="185" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="852.5" y="64.5" font-size="22" fill="#8bbcff" text-anchor="middle">K/V tile 2</text><rect x="320" y="160" width="500" height="80" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="570.0" y="194.5" font-size="22" fill="#8de0cf" text-anchor="middle">running m, l, u </text><text x="570.0" y="219.5" font-size="22" fill="#8de0cf" text-anchor="middle"> rescale + merge</text><path d="M190,145 L320,195" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#online-attention-arrow)"/><path d="M392,85 L392,160" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#online-attention-arrow)"/><path d="M622,85 L542,160" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#online-attention-arrow)"/><path d="M852,85 L692,160" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#online-attention-arrow)"/><rect x="890" y="170" width="180" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="980.0" y="207.0" font-size="22" fill="#8de0cf" text-anchor="middle">O = u / l</text><path d="M820,200 L890,200" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#online-attention-arrow)"/><text x="305" y="305" font-size="23" fill="#b7c7df" text-anchor="start">No full S × S score/probability array in this fused dataflow</text></g></svg>