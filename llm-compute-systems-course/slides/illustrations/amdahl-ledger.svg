<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="amdahl-ledger-title amdahl-ledger-desc" style="display:block;width:100%;height:auto"><title id="amdahl-ledger-title">A 2× component improvement becomes 1.43× overall</title><desc id="amdahl-ledger-desc">Two proportional stacked time bars show 100 seconds before and 70 seconds after halving only a 60-second compute component.</desc><defs><marker id="amdahl-ledger-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="65" font-size="24" fill="#eef4ff" text-anchor="start">Before</text><rect x="200" y="30" width="480" height="70" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="440.0" y="72.0" font-size="22" fill="#8bbcff" text-anchor="middle">compute 60 s</text><rect x="680" y="30" width="320" height="70" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="840.0" y="72.0" font-size="22" fill="#f1c979" text-anchor="middle">other 40 s</text><text x="20" y="225" font-size="24" fill="#eef4ff" text-anchor="start">After</text><rect x="200" y="190" width="240" height="70" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="320.0" y="232.0" font-size="22" fill="#8bbcff" text-anchor="middle">compute 30 s</text><rect x="440" y="190" width="320" height="70" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="600.0" y="232.0" font-size="22" fill="#f1c979" text-anchor="middle">other 40 s</text><text x="250" y="325" font-size="22" fill="#b7c7df" text-anchor="start">Same useful tokens; nonoverlapping phase costs; no vendor benchmark</text></g></svg>