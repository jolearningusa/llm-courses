<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="precision-lifecycle-title precision-lifecycle-desc" style="display:block;width:100%;height:auto"><title id="precision-lifecycle-title">Different precision paths need different evidence</title><desc id="precision-lifecycle-desc">A training path includes mixed-precision forward/backward and state, while a serving path calibrates and quantizes a frozen model then evaluates it.</desc><defs><marker id="precision-lifecycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#8bbcff" text-anchor="start">Training</text><rect x="30.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Initialize</text><path d="M272.0,97 L293.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="297.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">AMP / TE recipe</text><path d="M539.0,97 L560.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="564.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Loss + backward</text><path d="M806.0,97 L827.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="831.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Optimizer state</text><text x="30" y="205" font-size="24" fill="#8de0cf" text-anchor="start">Serving</text><rect x="30.0" y="230" width="239.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="149.5" y="269.0" font-size="22" fill="#8de0cf" text-anchor="middle">Freeze weights</text><path d="M272.0,262 L293.0,262" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="297.0" y="230" width="239.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="416.5" y="269.0" font-size="22" fill="#8de0cf" text-anchor="middle">Calibrate</text><path d="M539.0,262 L560.0,262" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="564.0" y="230" width="239.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="683.5" y="269.0" font-size="22" fill="#8de0cf" text-anchor="middle">Quantize / pack</text><path d="M806.0,262 L827.0,262" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#precision-lifecycle-arrow)"/><rect x="831.0" y="230" width="239.0" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="950.5" y="269.0" font-size="22" fill="#8de0cf" text-anchor="middle">Held-out evaluation</text></g></svg>