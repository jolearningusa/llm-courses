<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="capstone-evidence-title capstone-evidence-desc" style="display:block;width:100%;height:auto"><title id="capstone-evidence-title">The claim must survive every evidence gate</title><desc id="capstone-evidence-desc">A workload hypothesis passes through a credible baseline, correctness checks and measurement before a retain, revise or reject decision.</desc><defs><marker id="capstone-evidence-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="75" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="122.8" y="114.0" font-size="22" fill="#8bbcff" text-anchor="middle">Hypothesis</text><path d="M218.6,107 L239.6,107" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#capstone-evidence-arrow)"/><rect x="243.6" y="75" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="336.4" y="114.0" font-size="22" fill="#8bbcff" text-anchor="middle">Baseline</text><path d="M432.2,107 L453.2,107" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#capstone-evidence-arrow)"/><rect x="457.2" y="75" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="114.0" font-size="22" fill="#8bbcff" text-anchor="middle">Correctness</text><path d="M645.8,107 L666.8,107" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#capstone-evidence-arrow)"/><rect x="670.8" y="75" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="763.5999999999999" y="114.0" font-size="22" fill="#8bbcff" text-anchor="middle">Measure</text><path d="M859.4,107 L880.4,107" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#capstone-evidence-arrow)"/><rect x="884.4" y="75" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="977.1999999999999" y="114.0" font-size="22" fill="#8bbcff" text-anchor="middle">Decision</text><rect x="200" y="245" width="700" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="282.0" font-size="22" fill="#f1c979" text-anchor="middle">Raw records + ablation + adverse / held-out cases</text><path d="M550,139 L550,245" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#capstone-evidence-arrow)"/></g></svg>