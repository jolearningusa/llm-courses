<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="rubin-data-paths-title rubin-data-paths-desc" style="display:block;width:100%;height:auto"><title id="rubin-data-paths-title">CPU, scale-up and scale-out are different paths</title><desc id="rubin-data-paths-desc">Vera CPU connects to two Rubin GPUs with local HBM; GPU scale-up uses NVLink while external communication uses NIC/fabric paths.</desc><defs><marker id="rubin-data-paths-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="20" y="130" width="215" height="70" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="127.5" y="172.0" font-size="22" fill="#f1c979" text-anchor="middle">Vera CPU</text><rect x="350" y="35" width="260" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="480.0" y="62.0" font-size="22" fill="#8de0cf" text-anchor="middle">Rubin GPU</text><text x="480.0" y="87.0" font-size="22" fill="#8de0cf" text-anchor="middle">local HBM4</text><path d="M235,165 L290,165 L290,67 L350,67" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><rect x="350" y="235" width="260" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="480.0" y="262.0" font-size="22" fill="#8de0cf" text-anchor="middle">Rubin GPU</text><text x="480.0" y="287.0" font-size="22" fill="#8de0cf" text-anchor="middle">local HBM4</text><path d="M235,165 L290,165 L290,267 L350,267" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><rect x="800" y="35" width="275" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="937.5" y="62.0" font-size="22" fill="#8bbcff" text-anchor="middle">NVLink 6</text><text x="937.5" y="87.0" font-size="22" fill="#8bbcff" text-anchor="middle">scale-up peers</text><rect x="800" y="235" width="275" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="937.5" y="262.0" font-size="22" fill="#8bbcff" text-anchor="middle">NIC / DPU</text><text x="937.5" y="287.0" font-size="22" fill="#8bbcff" text-anchor="middle">scale-out fabric</text><path d="M610,67 L800,67" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><path d="M610,267 L800,267" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><path d="M610,267 L675,267 L675,67 L800,67" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><path d="M610,67 L720,67 L720,267 L800,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#rubin-data-paths-arrow)"/><text x="30" y="285" font-size="22" fill="#f1c979" text-anchor="start">CPU–GPU: C2C</text></g></svg>