<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="prefix-branches-title prefix-branches-desc" style="display:block;width:100%;height:auto"><title id="prefix-branches-title">A matching suffix is not a matching history</title><desc id="prefix-branches-desc">A radix-style prefix branches into two suffixes; a changed early token begins another history rather than reusing a matching suffix.</desc><defs><marker id="prefix-branches-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30" y="120" width="180" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="120.0" y="159.5" font-size="22" fill="#f1c979" text-anchor="middle">Identity + root</text><rect x="350" y="120" width="210" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="455.0" y="159.5" font-size="22" fill="#8de0cf" text-anchor="middle">Shared prefix A B</text><path d="M210,152 L350,152" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#prefix-branches-arrow)"/><rect x="790" y="35" width="270" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="925.0" y="72.0" font-size="22" fill="#8bbcff" text-anchor="middle">A B → C D</text><rect x="790" y="225" width="270" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="925.0" y="262.0" font-size="22" fill="#8bbcff" text-anchor="middle">A B → E F</text><path d="M560,152 L670,152 L670,65 L790,65" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#prefix-branches-arrow)"/><path d="M560,152 L700,152 L700,255 L790,255" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#prefix-branches-arrow)"/><text x="330" y="310" font-size="23" fill="#f1c979" text-anchor="start">Change A → new history; equal later text is insufficient.</text></g></svg>