<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-31-06-title mechanism-31-06-desc" style="display:block;width:100%;height:auto"><title id="mechanism-31-06-title">Correctness is a gate</title><desc id="mechanism-31-06-desc">A failed correctness gate cannot be traded for higher speed. Candidate output Exact protocol checks Numerical / quality checks Performance eligible Match the oracle to the claimed change</desc><defs><marker id="mechanism-31-06-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="125" width="230" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">Candidate output</text><rect x="410" y="20" width="295" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="557.5" y="68.0" font-size="23" fill="#8de0cf" text-anchor="middle">Exact protocol checks</text><rect x="410" y="235" width="295" height="80" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="557.5" y="269.0" font-size="23" fill="#f1c979" text-anchor="middle">Numerical / quality</text><text x="557.5" y="297.0" font-size="23" fill="#f1c979" text-anchor="middle">checks</text><rect x="855" y="125" width="220" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="965.0" y="159.0" font-size="23" fill="#8bbcff" text-anchor="middle">Performance</text><text x="965.0" y="187.0" font-size="23" fill="#8bbcff" text-anchor="middle">eligible</text><path d="M255,165 L330,165 L330,60 L410,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-31-06-arrow)"/><path d="M330,165 L330,275 L410,275" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-31-06-