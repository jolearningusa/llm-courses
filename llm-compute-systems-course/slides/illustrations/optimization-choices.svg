<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="optimization-choices-title optimization-choices-desc" style="display:block;width:100%;height:auto"><title id="optimization-choices-title">Choose an implementation, then validate it</title><desc id="optimization-choices-desc">An exported workload branches to a library, graph compiler or custom kernel path, then all candidates converge on the same correctness and measurement gate.</desc><defs><marker id="optimization-choices-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="20" y="135" width="180" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="110.0" y="162.0" font-size="22" fill="#f1c979" text-anchor="middle">Workload</text><text x="110.0" y="187.0" font-size="22" fill="#f1c979" text-anchor="middle">contract</text><rect x="330" y="20" width="350" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="505.0" y="47.0" font-size="22" fill="#8bbcff" text-anchor="middle">Existing library</text><text x="505.0" y="72.0" font-size="22" fill="#8bbcff" text-anchor="middle">cuBLAS / cuDNN</text><path d="M200,167 L265,167 L265,52 L330,52" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><path d="M680,52 L745,52 L745,167 L805,167" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><rect x="330" y="135" width="350" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="505.0" y="162.0" font-size="22" fill="#8de0cf" text-anchor="middle">Graph compiler</text><text x="505.0" y="187.0" font-size="22" fill="#8de0cf" text-anchor="middle">Inductor / TensorRT</text><path d="M200,167 L265,167 L265,167 L330,167" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><path d="M680,167 L745,167 L745,167 L805,167" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><rect x="330" y="250" width="350" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="505.0" y="277.0" font-size="22" fill="#8bbcff" text-anchor="middle">Custom kernel</text><text x="505.0" y="302.0" font-size="22" fill="#8bbcff" text-anchor="middle">Triton / TileLang / CUDA</text><path d="M200,167 L265,167 L265,282 L330,282" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><path d="M680,282 L745,282 L745,167 L805,167" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#optimization-choices-arrow)"/><rect x="805" y="135" width="275" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="942.5" y="162.0" font-size="22" fill="#f1c979" text-anchor="middle">Build / validate</text><text x="942.5" y="187.0" font-size="22" fill="#f1c979" text-anchor="middle">measure / retain</text></g></svg>