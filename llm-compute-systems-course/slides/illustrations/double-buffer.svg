<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="double-buffer-title double-buffer-desc" style="display:block;width:100%;height:auto"><title id="double-buffer-title">Overlap movement and matrix work</title><desc id="double-buffer-desc">Two buffers alternate: copy tile one while computing tile zero, then reuse the released buffer for tile two.</desc><defs><marker id="double-buffer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="70" font-size="23" fill="#eef4ff" text-anchor="start">Copy</text><text x="30" y="170" font-size="23" fill="#eef4ff" text-anchor="start">Compute</text><rect x="200" y="35" width="160" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="280.0" y="71.0" font-size="22" fill="#8bbcff" text-anchor="middle">tile 0 → A</text><rect x="360" y="35" width="160" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="440.0" y="71.0" font-size="22" fill="#8bbcff" text-anchor="middle">tile 1 → B</text><rect x="560" y="35" width="160" height="58" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="640.0" y="71.0" font-size="22" fill="#8bbcff" text-anchor="middle">tile 2 → A</text><rect x="360" y="135" width="200" height="58" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="460.0" y="171.0" font-size="22" fill="#8de0cf" text-anchor="middle">tile 0 from A</text><rect x="560" y="135" width="200" height="58" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="660.0" y="171.0" font-size="22" fill="#8de0cf" text-anchor="middle">tile 1 from B</text><rect x="760" y="135" width="200" height="58" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="860.0" y="171.0" font-size="22" fill="#8de0cf" text-anchor="middle">tile 2 from A</text><text x="180" y="270" font-size="23" fill="#f1c979" text-anchor="start">Fill</text><text x="460" y="270" font-size="23" fill="#8de0cf" text-anchor="start">Steady overlap</text><text x="900" y="270" font-size="23" fill="#f1c979" text-anchor="start">Drain</text><path d="M170,310 L1060,310" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#double-buffer-arrow)"/></g></svg>