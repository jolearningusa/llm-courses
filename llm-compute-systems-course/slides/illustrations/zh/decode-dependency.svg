<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="decode-dependency-title decode-dependency-desc" style="display:block;width:100%;height:auto"><title id="decode-dependency-title">有依赖的步骤，独立的序列</title><desc id="decode-dependency-desc">上方依次连接前向、下一 token 选择和下一次前向。下方三条独立序列可为一个批次提供并行工作。</desc><defs><marker id="decode-dependency-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="30" font-size="22" fill="#f1c979" text-anchor="start">同一序列：各步骤有依赖</text><rect x="30" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="180.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">输入 x_t 的前向</text><rect x="400" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">选出 x_(t+1)</text><rect x="770" y="52" width="300" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="920.0" y="91.0" font-size="22" fill="#8bbcff" text-anchor="middle">输入 x_(t+1) 的前向</text><path d="M335,84 L395,84" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#decode-dependency-arrow)"/><path d="M705,84 L765,84" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#decode-dependency-arrow)"/><text x="30" y="180" font-size="22" fill="#8de0cf" text-anchor="start">其他就绪序列：彼此独立的行</text><rect x="30" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="180.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">序列 A：token t+1</text><rect x="400" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">序列 B：token u+1</text><rect x="770" y="205" width="300" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="920.0" y="244.0" font-size="22" fill="#8de0cf" text-anchor="middle">序列 C：token v+1</text><text x="550" y="322" font-size="22" fill="#b7c7df" text-anchor="middle">批处理提供并行工作；每条序列的依赖仍然存在</text></g></svg>
