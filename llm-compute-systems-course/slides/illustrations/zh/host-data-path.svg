<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="host-data-path-title host-data-path-desc" style="display:block;width:100%;height:auto"><title id="host-data-path-title">在不丢失所有权的前提下喂饱设备</title><desc id="host-data-path-desc">存储和 CPU 预处理把数据送入锁页主机内存、DMA 和设备内存；每个边界都有生命周期和容量约束。</desc><defs><marker id="host-data-path-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="110" width="185.6" height="64" rx="5" fill="#101927" stroke="#50617a" stroke-width="2"/><text x="122.8" y="149.0" font-size="22" fill="#50617a" text-anchor="middle">存储</text><path d="M218.6,142 L239.6,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#host-data-path-arrow)"/><rect x="243.6" y="110" width="185.6" height="64" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="336.4" y="149.0" font-size="22" fill="#f1c979" text-anchor="middle">CPU 解码</text><path d="M432.2,142 L453.2,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#host-data-path-arrow)"/><rect x="457.2" y="110" width="185.6" height="64" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="149.0" font-size="22" fill="#f1c979" text-anchor="middle">锁页缓冲区</text><path d="M645.8,142 L666.8,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#host-data-path-arrow)"/><rect x="670.8" y="110" width="185.6" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="763.5999999999999" y="149.0" font-size="22" fill="#8bbcff" text-anchor="middle">DMA / 拷贝</text><path d="M859.4,142 L880.4,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#host-data-path-arrow)"/><rect x="884.4" y="110" width="185.6" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="977.1999999999999" y="149.0" font-size="22" fill="#8de0cf" text-anchor="middle">GPU / HBM</text><text x="90" y="65" font-size="21" fill="#b7c7df" text-anchor="start">读取 / 缺页</text><text x="390" y="65" font-size="21" fill="#b7c7df" text-anchor="start">有界队列</text><text x="770" y="65" font-size="21" fill="#b7c7df" text-anchor="start">拷贝完成</text><text x="160" y="260" font-size="25" fill="#f1c979" text-anchor="start">在消费者完成之前，不要覆盖源缓冲区。</text></g></svg>
