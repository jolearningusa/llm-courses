<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="aoti-artifact-title aoti-artifact-desc" style="display:block;width:100%;height:auto"><title id="aoti-artifact-title">生产者与加载器在制品处交汇</title><desc id="aoti-artifact-desc">生产者导出带约定的图并编译成本地包；独立的运行时加载器校验输入并执行该制品。</desc><defs><marker id="aoti-artifact-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="70" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="109.0" font-size="22" fill="#8bbcff" text-anchor="middle">模型 + 约定</text><path d="M272.0,102 L293.0,102" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#aoti-artifact-arrow)"/><rect x="297.0" y="70" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="109.0" font-size="22" fill="#8bbcff" text-anchor="middle">导出图</text><path d="M539.0,102 L560.0,102" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#aoti-artifact-arrow)"/><rect x="564.0" y="70" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="109.0" font-size="22" fill="#8bbcff" text-anchor="middle">编译包</text><path d="M806.0,102 L827.0,102" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#aoti-artifact-arrow)"/><rect x="831.0" y="70" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="109.0" font-size="22" fill="#8bbcff" text-anchor="middle">带检查的加载器</text><rect x="320" y="245" width="450" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="545.0" y="282.0" font-size="22" fill="#f1c979" text-anchor="middle">构建 / 加载 / 首次 / 预热后 分开计时</text></g></svg>
