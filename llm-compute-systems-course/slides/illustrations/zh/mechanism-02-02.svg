<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-02-02-title mechanism-02-02-desc" style="display:block;width:100%;height:auto"><title id="mechanism-02-02-title">解码器块提供可重复的工作</title><desc id="mechanism-02-02-desc">概念性的解码器块，并非所有模型的结构规范。 归一化与注意力 残差相加 归一化与 MLP 残差相加 / 下一块 权重、激活和 KV 的生命周期不同</desc><defs><marker id="mechanism-02-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">归一化与注意力</text><rect x="665" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="865.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">残差相加</text><rect x="665" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="865.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">归一化与 MLP</text><rect x="25" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="275.5" font-size="23" fill="#8bbcff" text-anchor="middle">残差相加 / 下一块</text><path d="M425,67 L665,67" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-02-02-arrow)"/><path d="M865,105 L865,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-02-02-arrow)"/><path d="M665,267 L425,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-02-02-arrow)"/><path d="M225,230 L225,105" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#mechanism-02-02-arrow)"/><text x="550" y="170" font-size="23" fill="#f1c979" text-anchor="middle">权重、激活和 KV 的生命周期不同</text></g></svg>
