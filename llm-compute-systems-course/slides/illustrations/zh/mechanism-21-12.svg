<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-21-12-title mechanism-21-12-desc" style="display:block;width:100%;height:auto"><title id="mechanism-21-12-title">工具结果的新鲜度是另一层</title><desc id="mechanism-21-12-desc">计算缓存命中不能证明外部工具结果仍然新鲜。 KV 有效性 模型与 token 兼容的位置 可复用计算 工具新鲜度 外部数据版本 时间 / 策略 答案可复用吗？</desc><defs><marker id="mechanism-21-12-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="75" font-size="22" fill="#8bbcff" text-anchor="start">KV 有效性</text><rect x="260" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="387.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">模型与 token</text><path d="M515,75 L540,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-21-12-arrow)"/><rect x="540" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="667.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">兼容的位置</text><path d="M795,75 L820,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-21-12-arrow)"/><rect x="820" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="947.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">可复用计算</text><text x="20" y="240" font-size="22" fill="#8de0cf" text-anchor="start">工具新鲜度</text><rect x="260" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="387.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">外部数据版本</text><path d="M515,240 L540,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-21-12-arrow)"/><rect x="540" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="667.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">时间 / 策略</text><path d="M795,240 L820,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-21-12-arrow)"/><rect x="820" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="947.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">答案可复用吗？</text></g></svg>
