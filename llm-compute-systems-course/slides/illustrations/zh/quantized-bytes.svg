<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="quantized-bytes-title quantized-bytes-desc" style="display:block;width:100%;height:auto"><title id="quantized-bytes-title">打包节省字节；缩放因子会用掉一部分</title><desc id="quantized-bytes-desc">一个 2048 字节的 BF16 数组变成 512 字节的打包 int4 值加上 128 字节的组缩放因子，原始数组缩小 3.2 倍。</desc><defs><marker id="quantized-bytes-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="45" font-size="24" fill="#8bbcff" text-anchor="start">BF16 基线：2,048 B</text><rect x="30" y="70" width="1024" height="65" rx="5" fill="#24456a" stroke="#8bbcff" stroke-width="2"/><text x="30" y="190" font-size="24" fill="#8de0cf" text-anchor="start">打包的 int4</text><rect x="30" y="215" width="512" height="65" rx="5" fill="#25564d" stroke="#8de0cf" stroke-width="2"/><text x="286" y="255" font-size="25" fill="#8de0cf" text-anchor="middle">512 B</text><rect x="560" y="215" width="128" height="65" rx="5" fill="#5f4b2a" stroke="#f1c979" stroke-width="2"/><text x="720" y="252" font-size="24" fill="#f1c979" text-anchor="start">128 B FP32 缩放因子</text><text x="650" y="115" font-size="24" fill="#eef4ff" text-anchor="start">原始数组缩小 3.2×</text></g></svg>
