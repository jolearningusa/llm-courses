<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-26-07-title mechanism-26-07-desc" style="display:block;width:100%;height:auto"><title id="mechanism-26-07-title">重叠受数据就绪的约束</title><desc id="mechanism-26-07-desc">只有参与 rank 的梯度就绪后，桶才能开始通信。 反向 集合通信 梯度 A 归约桶 A 梯度 B 归约桶 B 逻辑顺序 / 示意</desc><defs><marker id="mechanism-26-07-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="15" y="67" font-size="22" fill="#8bbcff" text-anchor="start">反向</text><text x="15" y="187" font-size="22" fill="#8de0cf" text-anchor="start">集合通信</text><rect x="230" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="327.5" y="76.0" font-size="23" fill="#8bbcff" text-anchor="middle">梯度 A</text><rect x="435" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="532.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">归约桶 A</text><rect x="435" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="532.5" y="76.0" font-size="23" fill="#8bbcff" text-anchor="middle">梯度 B</text><rect x="640" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="737.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">归约桶 B</text><path d="M210,290 L1080,290" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-26-07-arrow)"/><text x="650" y="330" font-size="21" fill="#b7c7df" text-anchor="middle">逻辑顺序 / 示意</text></g></svg>
