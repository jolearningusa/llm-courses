<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-16-03-title mechanism-16-03-desc" style="display:block;width:100%;height:auto"><title id="mechanism-16-03-title">前缀是一种计算身份</title><desc id="mechanism-16-03-desc">这些是联合身份条件，不是可相加的字节。 模型 / 适配器 ∩ 精确 token ID ∩ 位置 / 掩码 ∩ 共享域 缓存命中取决于兼容的因果计算 </desc><defs><marker id="mechanism-16-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">模型 / 适配器</text><text x="280" y="105" font-size="24" fill="#f1c979" text-anchor="middle">∩</text><rect x="295" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="415.0" y="86.5" font-size="23" fill="#8de0cf" text-anchor="middle">精确 token</text><text x="415.0" y="114.5" font-size="23" fill="#8de0cf" text-anchor="middle">ID</text><text x="550" y="105" font-size="24" fill="#f1c979" text-anchor="middle">∩</text><rect x="565" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">位置 / 掩码</text><text x="820" y="105" font-size="24" fill="#f1c979" text-anchor="middle">∩</text><rect x="835" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="955.0" y="100.5" font-size="23" fill="#8de0cf" text-anchor="middle">共享域</text><text x="550" y="215" font-size="26" fill="#f1c979" text-anchor="middle">缓存命中取决于兼容的因果计算</text><text x="550" y="300" font-size="25" fill="#eef4ff" text-anchor="middle"></text></g></svg>
