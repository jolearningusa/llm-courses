<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-20-09-title mechanism-20-09-desc" style="display:block;width:100%;height:auto"><title id="mechanism-20-09-title">从单个 token 到序列</title><desc id="mechanism-20-09-desc">构造示例：接受两个 token，随后拒绝，尾部不提交。 草稿 0 草稿 1 草稿 2 草稿 3 保留已接受前缀 校正首次拒绝，并丢弃后续 KV</desc><defs><marker id="mechanism-20-09-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="45" width="240" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="145.0" y="93.0" font-size="23" fill="#8de0cf" text-anchor="middle">草稿 0</text><path d="M265,85 L295,85" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-20-09-arrow)"/><rect x="295" y="45" width="240" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="415.0" y="93.0" font-size="23" fill="#8de0cf" text-anchor="middle">草稿 1</text><path d="M535,85 L565,85" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-20-09-arrow)"/><rect x="565" y="45" width="240" height="80" rx="4" fill="#101927" stroke="#ff9e9e" stroke-width="2"/><text x="685.0" y="93.0" font-size="23" fill="#ff9e9e" text-anchor="middle">草稿 2</text><path d="M805,85 L835,85" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-20-09-arrow)"/><rect x="835" y="45" width="240" height="80" rx="4" fill="#101927" stroke="#b7c7df" stroke-width="2"/><text x="955.0" y="93.0" font-size="23" fill="#b7c7df" text-anchor="middle">草稿 3</text><rect x="25" y="235" width="500" height="75" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="275.0" y="280.5" font-size="23" fill="#8de0cf" text-anchor="middle">保留已接受前缀</text><rect x="620" y="235" width="455" height="75" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="847.5" y="280.5" font-size="23" fill="#f1c979" text-anchor="middle">校正首次拒绝，并丢弃后续 KV</text><path d="M145,125 L145,180 L275,180 L275,235" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#mechanism-20-09-arrow)"/><path d="M685,125 L685,180 L845,180 L845,235" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#mechanism-20-09-arrow)"/></g></svg>
