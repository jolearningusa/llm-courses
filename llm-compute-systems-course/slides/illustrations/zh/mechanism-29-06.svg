<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-29-06-title mechanism-29-06-desc" style="display:block;width:100%;height:auto"><title id="mechanism-29-06-title">异步检查点的各阶段</title><desc id="mechanism-29-06-desc">只有安全暂存快照数据后，异步保存才能与训练重叠。 训练 写入端 训练步 / 暂存 写入暂存快照 下一个训练步 完成发布 逻辑顺序 / 示意</desc><defs><marker id="mechanism-29-06-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="15" y="67" font-size="22" fill="#8bbcff" text-anchor="start">训练</text><text x="15" y="187" font-size="22" fill="#8de0cf" text-anchor="start">写入端</text><rect x="230" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="327.5" y="62.0" font-size="23" fill="#8bbcff" text-anchor="middle">训练步 /</text><text x="327.5" y="90.0" font-size="23" fill="#8bbcff" text-anchor="middle">暂存</text><rect x="435" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="532.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">写入暂存快照</text><rect x="435" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="532.5" y="76.0" font-size="23" fill="#8bbcff" text-anchor="middle">下一个训练步</text><rect x="640" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="737.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">完成发布</text><path d="M210,290 L1080,290" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-29-06-arrow)"/><text x="650" y="330" font-size="21" fill="#b7c7df" text-anchor="middle">逻辑顺序 / 示意</text></g></svg>
