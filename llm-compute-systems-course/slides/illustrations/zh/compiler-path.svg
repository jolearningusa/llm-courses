<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="compiler-path-title compiler-path-desc" style="display:block;width:100%;height:auto"><title id="compiler-path-title">编译选择执行路径</title><desc id="compiler-path-desc">Dynamo 捕获和守卫生成 FX 图并交给 Inductor，后者可以选择库调用或生成的内核；守卫失配会回到捕获。</desc><defs><marker id="compiler-path-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="60" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="194.0" y="99.0" font-size="22" fill="#8bbcff" text-anchor="middle">捕获 / 守卫</text><path d="M361.0,92 L382.0,92" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#compiler-path-arrow)"/><rect x="386.0" y="60" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="550.0" y="99.0" font-size="22" fill="#8bbcff" text-anchor="middle">FX 图</text><path d="M717.0,92 L738.0,92" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#compiler-path-arrow)"/><rect x="742.0" y="60" width="328.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="906.0" y="99.0" font-size="22" fill="#8bbcff" text-anchor="middle">Inductor</text><rect x="620" y="235" width="190" height="60" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="715.0" y="272.0" font-size="22" fill="#8bbcff" text-anchor="middle">库调用</text><rect x="860" y="235" width="210" height="60" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="965.0" y="272.0" font-size="22" fill="#8de0cf" text-anchor="middle">生成的内核</text><path d="M900,124 L900,180 L715,180 L715,235" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#compiler-path-arrow)"/><path d="M930,124 L930,180 L965,180 L965,235" fill="none" st