<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-39-08-title mechanism-39-08-desc" style="display:block;width:100%;height:auto"><title id="mechanism-39-08-title">在真机上验证布局优化</title><desc id="mechanism-39-08-desc">功率曲线并非实测；记录运行边界与采样间隔。 指定传感器范围 基线 / 候选 P(t) t E = ∫ P(t) dt 相同完成工作量 t₀ t₁</desc><defs><marker id="mechanism-39-08-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="60" width="300" height="245" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2" stroke-dasharray="6 5"/><text x="175" y="105" font-size="23" fill="#8de0cf" text-anchor="middle">指定传感器范围</text><rect x="55" y="155" width="240" height="90" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="175.0" y="208.0" font-size="23" fill="#8bbcff" text-anchor="middle">基线 / 候选</text><path d="M435,280 L1060,280" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-39-08-arrow)"/><path d="M435,280 L435,40" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-39-08-arrow)"/><text x="400" y="35" font-size="23" fill="#eef4ff" text-anchor="start">P(t)</text><text x="1060" y="320" font-size="23" fill="#eef4ff" text-anchor="start">t</text><path d="M490,280 L490,220 L590,150 L690,185 L790,100 L890,135 L1000,200 L1000,280 Z" fill="#244747"/><path d="M490,220 L590,150 L690,185 L790,100 L890,135 L1000,200" fill="none" stroke="#8de0cf" stroke-width="2.5"/><text x="745" y="60" font-size="26" fill="#f1c979" text-anchor="middle">E = ∫ P(t) dt</text><text x="745" y="260" font-size="22" fill="#eef4ff" text-anchor="middle">相同完成工作量</text><text x="490" y="320" font-size="23" fill="#eef4ff" text-anchor="start">t₀</text><text x="1000" y="320" font-size="23" fill="#eef4ff" text-anchor="start">t₁</text></g></svg