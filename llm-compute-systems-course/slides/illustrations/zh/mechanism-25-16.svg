<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-25-16-title mechanism-25-16-desc" style="display:block;width:100%;height:auto"><title id="mechanism-25-16-title">梯度累积</title><desc id="mechanism-25-16-desc">累加循环示意；是否延后通信取决于实现。 微批前向 微批反向 累加梯度 同步更新 匹配有效批、损失缩放与同步方式</desc><defs><marker id="mechanism-25-16-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">微批前向</text><rect x="665" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="865.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">微批反向</text><rect x="665" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="865.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">累加梯度</text><rect x="25" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="275.5" font-size="23" fill="#8bbcff" text-anchor="middle">同步更新</text><path d="M425,67 L665,67" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-25-16-arrow)"/><path d="M865,105 L865,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-25-16-arrow)"/><path d="M665,267 L425,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-25-16-arrow)"/><path d="M225,230 L225,105" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#mechanism-25-16-arrow)"/><text x="550" y="170" font-size="23" fill="#f1c979" text-anchor="middle">匹配有效批、损失缩放与同步方式</text></g></svg>
