<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-04-14-title mechanism-04-14-desc" style="display:block;width:100%;height:auto"><title id="mechanism-04-14-title">预取与背压</title><desc id="mechanism-04-14-desc">预取深度在供给不足、内存占用与排队之间权衡。 生产者 有界队列 消费者 容量反馈 反压限制待处理工作量</desc><defs><marker id="mechanism-04-14-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">生产者</text><rect x="665" y="30" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="865.0" y="75.5" font-size="23" fill="#8bbcff" text-anchor="middle">有界队列</text><rect x="665" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="865.0" y="275.5" font-size="23" fill="#8de0cf" text-anchor="middle">消费者</text><rect x="25" y="230" width="400" height="75" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="225.0" y="275.5" font-size="23" fill="#8bbcff" text-anchor="middle">容量反馈</text><path d="M425,67 L665,67" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-04-14-arrow)"/><path d="M865,105 L865,230" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-04-14-arrow)"/><path d="M665,267 L425,267" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-04-14-arrow)"/><path d="M225,230 L225,105" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#mechanism-04-14-arrow)"/><text x="550" y="170" font-size="23" fill="#f1c979" text-anchor="middle">反压限制待处理工作量</text></g></svg>
