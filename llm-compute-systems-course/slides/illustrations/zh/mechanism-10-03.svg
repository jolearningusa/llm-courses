<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-10-03-title mechanism-10-03-desc" style="display:block;width:100%;height:auto"><title id="mechanism-10-03-title">流水化的分块循环</title><desc id="mechanism-10-03-desc">就绪后才能读取；消费者释放后才能复用缓冲区。 生产者 消费者 A 写入块 0 A 读取块 0 B 写入块 1 B 读取块 1 逻辑顺序 / 示意</desc><defs><marker id="mechanism-10-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="15" y="67" font-size="22" fill="#8bbcff" text-anchor="start">生产者</text><text x="15" y="187" font-size="22" fill="#8de0cf" text-anchor="start">消费者</text><rect x="230" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="327.5" y="76.0" font-size="23" fill="#8bbcff" text-anchor="middle">A 写入块 0</text><rect x="435" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="532.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">A 读取块 0</text><rect x="435" y="30" width="195" height="76" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="532.5" y="76.0" font-size="23" fill="#8bbcff" text-anchor="middle">B 写入块 1</text><rect x="640" y="150" width="195" height="76" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="737.5" y="196.0" font-size="23" fill="#8de0cf" text-anchor="middle">B 读取块 1</text><path d="M210,290 L1080,290" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-10-03-arrow)"/><text x="650" y="330" font-size="21" fill="#b7c7df" text-anchor="middle">逻辑顺序 / 示意</text></g></svg>
