<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-05-11-title mechanism-05-11-desc" style="display:block;width:100%;height:auto"><title id="mechanism-05-11-title">梯度累加</title><desc id="mechanism-05-11-desc">两个微批累加的示例，并非两次优化器更新。 微批 1 反向 微批 2 反向 梯度相加 一次优化器更新 匹配损失缩放与有效批大小</desc><defs><marker id="mechanism-05-11-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="25" width="330" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="190.0" y="73.0" font-size="23" fill="#8bbcff" text-anchor="middle">微批 1 反向</text><rect x="25" y="235" width="330" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="190.0" y="283.0" font-size="23" fill="#8bbcff" text-anchor="middle">微批 2 反向</text><rect x="445" y="125" width="300" height="80" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="595.0" y="173.0" font-size="23" fill="#f1c979" text-anchor="middle">梯度相加</text><rect x="855" y="125" width="220" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="965.0" y="173.0" font-size="23" fill="#8de0cf" text-anchor="middle">一次优化器更新</text><path d="M355,65 L400,65 L400,165 L445,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-05-11-arrow)"/><path d="M355,275 L400,275 L400,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-05-11-arrow)"/><path d="M745,165 L855,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-05-11-arrow)"/><text x="550" y="335" font-size="23" fill="#b7c7df" text-anchor="middle">匹配损失缩放与有效批大小</text></g></svg>
