<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="agent-wait-title agent-wait-desc" style="display:block;width:100%;height:auto"><title id="agent-wait-title">智能体等待期间，状态有其生命周期</title><desc id="agent-wait-desc">一次模型调用进入工具等待。等待期间，策略可以把状态保留在 HBM 中、迁移兼容状态，或将其逐出并在恢复时重算。</desc><defs><marker id="agent-wait-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="20" y="130" width="180" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="110.0" y="169.5" font-size="22" fill="#8bbcff" text-anchor="middle">工具等待</text><rect x="340" y="20" width="330" height="65" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="505.0" y="59.5" font-size="22" fill="#8de0cf" text-anchor="middle">保留在 HBM</text><path d="M200,162 L260,162 L260,52 L340,52" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><path d="M670,52 L750,52 L750,162 L830,162" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><rect x="340" y="130" width="330" height="65" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="505.0" y="169.5" font-size="22" fill="#8bbcff" text-anchor="middle">卸载 / 恢复</text><path d="M200,162 L260,162 L260,162 L340,162" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><path d="M670,162 L750,162 L750,162 L830,162" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><rect x="340" y="240" width="330" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="505.0" y="279.5" font-size="22" fill="#f1c979" text-anchor="middle">逐出 / 重算</text><path d="M200,162 L260,162 L260,272 L340,272" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><path d="M670,272 L750,272 L750,162 L830,162" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#agent-wait-arrow)"/><rect x="830" y="130" width="240" height="65" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="950.0" y="169.5" font-size="22" fill="#f1c979" text-anchor="middle">校验 + 恢复</text></g></svg>
