<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-27-10-title mechanism-27-10-desc" style="display:block;width:100%;height:auto"><title id="mechanism-27-10-title">重计算是在交换资源</title><desc id="mechanism-27-10-desc">减少保留内存需要额外重计算，也可能改变 RNG 要求。 保存激活 前向 保留中间结果 反向读取 重计算 前向 保留边界输入 重放与反向</desc><defs><marker id="mechanism-27-10-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="75" font-size="22" fill="#8bbcff" text-anchor="start">保存激活</text><rect x="260" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="387.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">前向</text><path d="M515,75 L540,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-27-10-arrow)"/><rect x="540" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="667.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">保留中间结果</text><path d="M795,75 L820,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-27-10-arrow)"/><rect x="820" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="947.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">反向读取</text><text x="20" y="240" font-size="22" fill="#8de0cf" text-anchor="start">重计算</text><rect x="260" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="387.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">前向</text><path d="M515,240 L540,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-27-10-arrow)"/><rect x="540" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="667.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">保留边界输入</text><path d="M795,240 L820,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-27-10-arrow)"/><rect x="820" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="947.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">重放与反向</text></g></svg>
