<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-15-03-title mechanism-15-03-desc" style="display:block;width:100%;height:auto"><title id="mechanism-15-03-title">迭代级批处理</title><desc id="mechanism-15-03-desc">构造的迭代示例；每个存活序列仍保留 token 依赖。 迭代 t A、B 解码 C 完成 新 D 等待 迭代 t+1 A、B 解码 D 加入 回收 C 的槽位</desc><defs><marker id="mechanism-15-03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="75" font-size="22" fill="#8bbcff" text-anchor="start">迭代 t</text><rect x="260" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="387.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">A、B 解码</text><path d="M515,75 L540,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-15-03-arrow)"/><rect x="540" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="667.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">C 完成</text><path d="M795,75 L820,75" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-15-03-arrow)"/><rect x="820" y="35" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="947.5" y="83.0" font-size="23" fill="#8bbcff" text-anchor="middle">新 D 等待</text><text x="20" y="240" font-size="22" fill="#8de0cf" text-anchor="start">迭代 t+1</text><rect x="260" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="387.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">A、B 解码</text><path d="M515,240 L540,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-15-03-arrow)"/><rect x="540" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="667.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">D 加入</text><path d="M795,240 L820,240" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-15-03-arrow)"/><rect x="820" y="200" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="947.5" y="248.0" font-size="23" fill="#8de0cf" text-anchor="middle">回收 C 的槽位</text></g></svg>
