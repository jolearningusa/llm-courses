<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="engine-design-points-title engine-design-points-desc" style="display:block;width:100%;height:auto"><title id="engine-design-points-title">一个 API，两类引擎</title><desc id="engine-design-points-desc">OpenAI 风格的 HTTP API 之下有两类引擎：运行在 CPU、Metal 和消费级 GPU 上的本地引擎（llama.cpp、Ollama、MLX），以及运行在数据中心 GPU 上、使用分页 KV 和连续批处理的服务引擎（vLLM、SGLang、TensorRT-LLM）。</desc><defs><marker id="engine-design-points-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="300" y="20" width="500" height="58" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="550.0" y="56.0" font-size="22" fill="#f1c979" text-anchor="middle">OpenAI 风格的 HTTP API</text><rect x="40" y="130" width="470" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="275.0" y="169.0" font-size="22" fill="#8de0cf" text-anchor="middle">本地：llama.cpp · Ollama · MLX</text><rect x="590" y="130" width="470" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="825.0" y="169.0" font-size="22" fill="#8bbcff" text-anchor="middle">服务：vLLM · SGLang · TensorRT-LLM</text><path d="M450,78 L275,130" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#engine-design-points-arrow)"/><path d="M650,78 L825,130" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#engine-design-points-arrow)"/><rect x="40" y="250" width="470" height="64" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="275.0" y="289.0" font-size="22" fill="#8de0cf" text-anchor="middle">GGUF / MLX 量化 · 卸载 · 批量 ≈ 1</text><rect x="590" y="250" width="470" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="825.0" y="289.0" font-size="22" fill="#8bbcff" text-anchor="middle">分页 KV · 连续批处理 · TP/EP</text><path d="M275,194 L275,250" fill="none" stroke="#8de0cf" stroke-width="2.5" marker-end="url(#engine-design-points-arrow)"/><path d="M825,194 L825,250" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#engine-design-points-arrow)"/></g></svg>
