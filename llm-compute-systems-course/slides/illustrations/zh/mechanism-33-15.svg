<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-33-15-title mechanism-33-15-desc" style="display:block;width:100%;height:auto"><title id="mechanism-33-15-title">边缘 DSP 与 NPU 栈：库与图编译器</title><desc id="mechanism-33-15-desc">DSP/NPU 部署需要受支持的工具链、布局与恢复路径。 导出模型 受支持委托区域 不支持 / CPU 区域 目标运行时 库与图编译器在明确边界处衔接</desc><defs><marker id="mechanism-33-15-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="125" width="230" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">导出模型</text><rect x="410" y="20" width="295" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="557.5" y="68.0" font-size="23" fill="#8de0cf" text-anchor="middle">受支持委托区域</text><rect x="410" y="235" width="295" height="80" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="557.5" y="269.0" font-size="23" fill="#f1c979" text-anchor="middle">不支持 / CPU</text><text x="557.5" y="297.0" font-size="23" fill="#f1c979" text-anchor="middle">区域</text><rect x="855" y="125" width="220" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="965.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">目标运行时</text><path d="M255,165 L330,165 L330,60 L410,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-33-15-arrow)"/><path d="M330,165 L330,275 L410,275" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-33-15-arrow)"/><path d="M705,60 L785,60 L785,165 L855,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-33-15-arrow)"/><path d="M705,275 L785,275 L785,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-33-15-arrow)"/><text x="550" y="160" font-size="23" fill="#b7c7df" text-anchor="middle">库与图编译器在明确边界处衔接</text></g></svg>
