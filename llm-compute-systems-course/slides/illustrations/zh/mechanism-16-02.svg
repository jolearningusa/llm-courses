<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-16-02-title mechanism-16-02-desc" style="display:block;width:100%;height:auto"><title id="mechanism-16-02-title">六层缓存</title><desc id="mechanism-16-02-desc">不同缓存对象省去不同工作，并需要各自的有效性契约。 已完成答案 省去有效的完整调用 兼容前缀 省去重复预填充 存活序列 KV 省去旧状态重计算 卸载会话 省去等待后的重计算 已编译代码 / 图 省去编译 / 启动设置 权重 / OS 页面 省去部分加载流量</desc><defs><marker id="mechanism-16-02-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="10" width="450" height="44" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="40.0" font-size="23" fill="#8bbcff" text-anchor="middle">已完成答案</text><path d="M475,32 L590,32" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="40" font-size="23" fill="#eef4ff" text-anchor="start">省去有效的完整调用</text><rect x="25" y="65" width="450" height="44" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="95.0" font-size="23" fill="#8de0cf" text-anchor="middle">兼容前缀</text><path d="M475,87 L590,87" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="95" font-size="23" fill="#eef4ff" text-anchor="start">省去重复预填充</text><rect x="25" y="120" width="450" height="44" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="250.0" y="150.0" font-size="23" fill="#8bbcff" text-anchor="middle">存活序列 KV</text><path d="M475,142 L590,142" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-02-arrow)"/><text x="620" y="150" font-size="23" fill="#eef4ff" text-anchor="start">省去旧状态重计算</text><rect x="25" y="175" width="450" height="44" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="250.0" y="205.0" font-size="23"