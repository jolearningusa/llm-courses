<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-01-16-title mechanism-01-16-desc" style="display:block;width:100%;height:auto"><title id="mechanism-01-16-title">阿姆达尔极限</title><desc id="mechanism-01-16-desc">固定工作负载下的 Amdahl 分析模型。 被加速比例 f 未改变比例 1 − f Speedup = 1 / [(1 − f) + f / s] 未改变部分限制端到端加速比</desc><defs><marker id="mechanism-01-16-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="20" width="330" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="190.0" y="68.0" font-size="23" fill="#8bbcff" text-anchor="middle">被加速比例 f</text><rect x="745" y="20" width="330" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="910.0" y="68.0" font-size="23" fill="#8de0cf" text-anchor="middle">未改变比例 1 − f</text><path d="M190,100 L190,155 L550,155 L550,190" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-01-16-arrow)"/><path d="M910,100 L910,155 L550,155" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-01-16-arrow)"/><text x="550" y="230" font-size="27" fill="#f1c979" text-anchor="middle">Speedup = 1 / [(1 − f) + f / s]</text><text x="550" y="310" font-size="24" fill="#8de0cf" text-anchor="middle">未改变部分限制端到端加速比</text></g></svg>
