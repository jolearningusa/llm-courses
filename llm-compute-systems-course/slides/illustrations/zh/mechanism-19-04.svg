<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-19-04-title mechanism-19-04-desc" style="display:block;width:100%;height:auto"><title id="mechanism-19-04-title">分布式路径</title><desc id="mechanism-19-04-desc">路由流水线会暴露网络流量与专家负载不均。 路由与排列 All-to-al l 分发 专家 GEMM 返回并组合 </desc><defs><marker id="mechanism-19-04-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="160.5" font-size="23" fill="#8bbcff" text-anchor="middle">路由与排列</text><path d="M265,153 L295,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-19-04-arrow)"/><rect x="295" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="415.0" y="146.5" font-size="23" fill="#8bbcff" text-anchor="middle">All-to-al</text><text x="415.0" y="174.5" font-size="23" fill="#8bbcff" text-anchor="middle">l 分发</text><path d="M535,153 L565,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-19-04-arrow)"/><rect x="565" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="160.5" font-size="23" fill="#8bbcff" text-anchor="middle">专家 GEMM</text><path d="M805,153 L835,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-19-04-arrow)"/><rect x="835" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="955.0" y="160.5" font-size="23" fill="#8de0cf" text-anchor="middle">返回并组合</text><text x="550" y="295" font-size="26" fill="#f1c979" text-anchor="middle"></text></g></svg>
