<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-32-09-title mechanism-32-09-desc" style="display:block;width:100%;height:auto"><title id="mechanism-32-09-title">AOT 部署选择</title><desc id="mechanism-32-09-desc">产物格式不会消除加载端、ABI 或内核要求。 部署工作负载 通用图产物 目标编译包 兼容运行时 比较冷启动、可移植性与算子支持</desc><defs><marker id="mechanism-32-09-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="125" width="230" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="140.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">部署工作负载</text><rect x="410" y="20" width="295" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="557.5" y="68.0" font-size="23" fill="#8de0cf" text-anchor="middle">通用图产物</text><rect x="410" y="235" width="295" height="80" rx="4" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="557.5" y="283.0" font-size="23" fill="#f1c979" text-anchor="middle">目标编译包</text><rect x="855" y="125" width="220" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="965.0" y="173.0" font-size="23" fill="#8bbcff" text-anchor="middle">兼容运行时</text><path d="M255,165 L330,165 L330,60 L410,60" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-32-09-arrow)"/><path d="M330,165 L330,275 L410,275" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-32-09-arrow)"/><path d="M705,60 L785,60 L785,165 L855,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-32-09-arrow)"/><path d="M705,275 L785,275 L785,165" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-32-09-arrow)"/><text x="550" y="160" font-size="23" fill="#b7c7df" text-anchor="middle">比较冷启动、可移植性与算子支持</text