<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-16-12-title mechanism-16-12-desc" style="display:block;width:100%;height:auto"><title id="mechanism-16-12-title">所有权与驱逐</title><desc id="mechanism-16-12-desc">完成状态、引用与在途设备访问都必须允许复用。 分配 共享前缀 请求 A 结束 B 仍在运行 最后持有者结束 所有存活持有者都释放之后，才能回收共享块</desc><defs><marker id="mechanism-16-12-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="150" y="40" font-size="22" fill="#eef4ff" text-anchor="middle">分配</text><path d="M150,65 L150,260" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="355" y="40" font-size="22" fill="#eef4ff" text-anchor="middle">共享前缀</text><path d="M355,65 L355,260" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="560" y="40" font-size="22" fill="#eef4ff" text-anchor="middle">请求 A 结束</text><path d="M560,65 L560,260" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="765" y="40" font-size="22" fill="#eef4ff" text-anchor="middle">B 仍在运行</text><path d="M765,65 L765,260" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="970" y="40" font-size="22" fill="#eef4ff" text-anchor="middle">最后持有者结束</text><path d="M970,65 L970,260" fill="none" stroke="#50617a" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M150,115 L1030,115" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-16-12-arrow)"/><rect x="150" y="180" width="820" height="54" rx="4" fill="#273142" stroke="#f1c979" stroke-width="2"/><text x="560.0" y="215" font-size="23" fill="#f1c979" text-anchor="middle">所有存活持有者都释放之后，才能回收共享块</text></g></svg>
