<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-06-09-title mechanism-06-09-desc" style="display:block;width:100%;height:auto"><title id="mechanism-06-09-title">融合、图重放与巨型内核</title><desc id="mechanism-06-09-desc">融合改变中间工作；重放主要优化启动编排。 算子融合 读取输入 融合算子工作 写出结果 图重放 记录启动 重放启动图 仍执行内核工作 Megakernel 设备端调度 多个算子任务 较大范围融合内核</desc><defs><marker id="mechanism-06-09-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="20" y="50" font-size="22" fill="#8bbcff" text-anchor="start">算子融合</text><rect x="260" y="10" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="387.5" y="58.0" font-size="23" fill="#8bbcff" text-anchor="middle">读取输入</text><path d="M515,50 L540,50" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-06-09-arrow)"/><rect x="540" y="10" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="667.5" y="58.0" font-size="23" fill="#8bbcff" text-anchor="middle">融合算子工作</text><path d="M795,50 L820,50" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-06-09-arrow)"/><rect x="820" y="10" width="255" height="80" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="947.5" y="58.0" font-size="23" fill="#8bbcff" text-anchor="middle">写出结果</text><text x="20" y="160" font-size="22" fill="#8de0cf" text-anchor="start">图重放</text><rect x="260" y="120" width="255" height="80" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="387.5" y="168.0" font-size="23" fill="#8de0cf" text-anchor="middle">记录启动</text><path d="M515,160 L540,160" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-06-09-arrow)"/><rect x="540" y="120" width="255" height="80" rx="4" fill="#101927" stro