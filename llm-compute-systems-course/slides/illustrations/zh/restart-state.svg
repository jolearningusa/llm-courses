<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="restart-state-title restart-state-desc" style="display:block;width:100%;height:auto"><title id="restart-state-title">恢复出相同的训练轨迹</title><desc id="restart-state-desc">将一次不中断的六步运行，与一次在第三步后保存、并在恢复模型/优化器/RNG/数据游标后继续的运行进行比较。</desc><defs><marker id="restart-state-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="23" fill="#eef4ff" text-anchor="start">不中断</text><rect x="210" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="270.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 1 步</text><rect x="350" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="410.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 2 步</text><rect x="490" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="550.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 3 步</text><rect x="630" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="690.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 4 步</text><rect x="770" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="830.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 5 步</text><rect x="910" y="10" width="120" height="55" rx="5" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="970.0" y="44.5" font-size="22" fill="#8de0cf" text-anchor="middle">第 6 步</text><text x="30" y="145" font-size="23" fill="#eef4ff" text-anchor="start">中断</text><rect x="210" y="115" width="120" height="55" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2