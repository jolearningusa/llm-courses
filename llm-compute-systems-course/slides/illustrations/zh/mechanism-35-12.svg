<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-35-12-title mechanism-35-12-desc" style="display:block;width:100%;height:auto"><title id="mechanism-35-12-title">vLLM：面向大量请求的吞吐</title><desc id="mechanism-35-12-desc">服务路径示意；比较引擎时需匹配模型、质量与资源。 等待请求 迭代调度器 分页 KV 与内核 Token 完成 </desc><defs><marker id="mechanism-35-12-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="160.5" font-size="23" fill="#8bbcff" text-anchor="middle">等待请求</text><path d="M265,153 L295,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-35-12-arrow)"/><rect x="295" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="415.0" y="160.5" font-size="23" fill="#8bbcff" text-anchor="middle">迭代调度器</text><path d="M535,153 L565,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-35-12-arrow)"/><rect x="565" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="160.5" font-size="23" fill="#8bbcff" text-anchor="middle">分页 KV 与内核</text><path d="M805,153 L835,153" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#mechanism-35-12-arrow)"/><rect x="835" y="110" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="955.0" y="160.5" font-size="23" fill="#8de0cf" text-anchor="middle">Token 完成</text><text x="550" y="295" font-size="26" fill="#f1c979" text-anchor="middle"></text></g></svg>
