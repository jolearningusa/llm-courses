<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="mechanism-01-13-title mechanism-01-13-desc" style="display:block;width:100%;height:auto"><title id="mechanism-01-13-title">容量是另一个约束</title><desc id="mechanism-01-13-desc">等宽方框只标记预算项，宽度不代表字节数。 权重 + 存活 KV + 激活 + 工作区 所有同时存活的分配必须符合容量预算 </desc><defs><marker id="mechanism-01-13-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="350" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="25" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="145.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">权重</text><text x="280" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="295" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="415.0" y="100.5" font-size="23" fill="#8de0cf" text-anchor="middle">存活 KV</text><text x="550" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="565" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="685.0" y="100.5" font-size="23" fill="#8bbcff" text-anchor="middle">激活</text><text x="820" y="105" font-size="24" fill="#f1c979" text-anchor="middle">+</text><rect x="835" y="50" width="240" height="85" rx="4" fill="#101927" stroke="#8de0cf" stroke-width="2"/><text x="955.0" y="100.5" font-size="23" fill="#8de0cf" text-anchor="middle">工作区</text><text x="550" y="215" font-size="26" fill="#f1c979" text-anchor="middle">所有同时存活的分配必须符合容量预算</text><text x="550" y="300" font-size="25" fill="#eef4ff" text-anchor="middle"></text></g></svg>
