<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="execution-stack-title execution-stack-desc" style="display:block;width:100%;height:auto"><title id="execution-stack-title">工作在哪里运行</title><desc id="execution-stack-desc">框架和编译器把工作交给库或自定义内核；执行取决于 CPU、GPU 内存和网络。</desc><defs><marker id="execution-stack-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">框架</text><path d="M272.0,97 L293.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#execution-stack-arrow)"/><rect x="297.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">图 / 编译器</text><path d="M539.0,97 L560.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#execution-stack-arrow)"/><rect x="564.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">库或内核</text><path d="M806.0,97 L827.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#execution-stack-arrow)"/><rect x="831.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">GPU 执行</text><rect x="30" y="225" width="240" height="64" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="150.0" y="264.0" font-size="22" fill="#f1c979" text-anchor="middle">CPU / OS / 输入</text><rect x="430" y="225" width="240" height="64" rx="5" fill="#101927" st