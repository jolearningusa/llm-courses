<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="optimization-engine-title optimization-engine-desc" style="display:block;width:100%;height:auto"><title id="optimization-engine-title">Optimization controller and independent evaluator</title><desc id="optimization-engine-desc">A profiler supplies workload facts to a bounded planner. The planner proposes candidates to an independent evaluator; validated artifacts and all failures enter an immutable archive that informs future ranking.</desc><defs><marker id="optimization-engine-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b7c7df"/></marker></defs><rect width="1100" height="340" fill="#101927"/><g font-family="system-ui,sans-serif"><rect x="30.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="149.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Profiler / contract</text><path d="M272.0,97 L293.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#optimization-engine-arrow)"/><rect x="297.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="416.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Bounded planner</text><path d="M539.0,97 L560.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#optimization-engine-arrow)"/><rect x="564.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="683.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Build + evaluator</text><path d="M806.0,97 L827.0,97" fill="none" stroke="#b7c7df" stroke-width="2.5" marker-end="url(#optimization-engine-arrow)"/><rect x="831.0" y="65" width="239.0" height="64" rx="5" fill="#101927" stroke="#8bbcff" stroke-width="2"/><text x="950.5" y="104.0" font-size="22" fill="#8bbcff" text-anchor="middle">Accepted artifact</text><rect x="230" y="245" width="650" height="60" rx="5" fill="#101927" stroke="#f1c979" stroke-width="2"/><text x="555.0" y="282.0" font-size="22" fill="#f1c979" text-anchor="middle">Experiment archive: successes + failures + search cost</text><path d="M680,129 L680,245" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#optimization-engine-arrow)"/><path d="M400,245 L400,205 L430,205 L430,129" fill="none" stroke="#f1c979" stroke-width="2.5" marker-end="url(#optimization-engine-arrow)"/></g></svg>